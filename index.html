{ id:'a3m1', arc:2, sec:'3.1–3.2', pages:'48–51', hue:200, horns:2, eyes:2,
  title:['Hardware, Software & von Neumann','Hardware, software e von Neumann'], topic:['What a computer is; the von Neumann architecture','Che cos\'è un computer; l\'architettura di von Neumann'],
  demon:['Static Imp','Folletto Statico'], tech:['Circuit Form · First Technique: Input–Output Slash','Stile del Circuito · Prima Tecnica: Fendente Input–Output'],
  scenes:[
   {who:'s', vis:'ipos', text:[`<p>A computer takes in data, works on it, gives back results and keeps data for later:</p><p><b>1.</b> [[Input|input]]: data goes in (you type).<br><b>2.</b> [[Processing|elaborazione]]: the CPU works on it.<br><b>3.</b> [[Output|output]]: results come out (letters on the screen).<br><b>4.</b> [[Storage|memorizzazione]]: data is kept (saved on the SSD).</p><p>Watch the dots: that's data moving between the parts.</p>`,
     `<p>Un computer riceve dati, li elabora, restituisce risultati e conserva i dati per dopo:</p><p><b>1.</b> [[Input|input]]: i dati entrano (scrivi).<br><b>2.</b> [[Processing|elaborazione]]: la CPU li elabora.<br><b>3.</b> [[Output|output]]: escono i risultati (le lettere sullo schermo).<br><b>4.</b> [[Storage|memorizzazione]]: i dati vengono conservati (salvati sull'SSD).</p><p>Guarda i puntini: sono i dati che viaggiano tra le parti.</p>`]},
   {who:'s', vis:'hwsw', text:[`<p>[[Hardware|hardware]] is the physical parts you can touch. [[Software|software]] is the programs: instructions that tell the hardware what to do.</p><p>Think of a hunter: hardware is the body and the sword, software is the training and the techniques. A sword with no technique does nothing.</p>`,
     `<p>L'[[Hardware|hardware]] sono le parti fisiche, che si possono toccare. Il [[Software|software]] sono i programmi: istruzioni che dicono all'hardware cosa fare.</p><p>Pensa a una cacciatrice: l'hardware è il corpo e la spada, il software è l'allenamento e le tecniche. Una spada senza tecnica non serve a nulla.</p>`]},
   {who:'s', vis:'vonneumann', text:[`<p>In 1945 the mathematician John von Neumann described the design that almost every computer still follows, the [[von Neumann architecture|architettura di von Neumann]]:</p><p>a <b>CPU</b>; a <b>central memory</b> that holds <b>both programs and data</b>; <b>input and output</b> devices; all linked by a [[bus|bus]].</p><p>Because the program sits in memory, you can change what the computer does just by loading a different program.</p>`,
     `<p>Nel 1945 il matematico John von Neumann descrisse lo schema che quasi tutti i computer seguono ancora oggi, l'[[von Neumann architecture|architettura di von Neumann]]:</p><p>una <b>CPU</b>; una <b>memoria centrale</b> che contiene <b>sia i programmi sia i dati</b>; dispositivi di <b>input e output</b>; il tutto collegato da un [[bus|bus]].</p><p>Siccome il programma sta in memoria, puoi cambiare ciò che fa il computer semplicemente caricando un altro programma.</p>`]},
   {type:'sort', title:['Hardware or software?','Hardware o software?'], cats:[['Hardware','Hardware'],['Software','Software']], items:[
     {n:['Keyboard','Tastiera'],i:'keyboard',c:0,why:['You can touch it: hardware.','Si può toccare: hardware.']},
     {n:['Web browser','Browser'],i:'app',c:1,why:['A program: software.','Un programma: software.']},
     {n:['CPU','CPU'],i:'chip',c:0,why:['A physical chip: hardware.','Un chip fisico: hardware.']},
     {n:['Operating system','Sistema operativo'],i:'layers',c:1,why:['The most important software.','Il software più importante.']},
     {n:['Video game','Videogioco'],i:'gamepad',c:1,why:['The game itself is a program.','Il gioco in sé è un programma.']},
     {n:['Monitor','Monitor'],i:'monitor',c:0,why:['A physical device.','Un dispositivo fisico.']},
     {n:['Printer driver','Driver della stampante'],i:'gear',c:1,why:['Drivers are small programs.','I driver sono piccoli programmi.']},
     {n:['RAM stick','Banco di RAM'],i:'ram',c:0,why:['A physical memory module.','Un modulo fisico di memoria.']}]},
   {who:'d', vis:'demon', text:[`<p>Bzzzt! I'm the Static Imp. I scramble input and output so nobody can tell them apart!</p>`,`<p>Bzzzt! Sono il Folletto Statico. Confondo input e output finché nessuno li distingue più!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['What is hardware?','Che cos\'è l\'hardware?'],a:[['The physical parts of a computer','Le parti fisiche del computer'],['The programs on a computer','I programmi del computer'],['Only the screen','Solo lo schermo'],['The internet','Internet']],why:['Hardware = what you can touch.','Hardware = ciò che puoi toccare.']},
   {q:['Which of these is software?','Quale di questi è software?'],a:[['A web browser','Un browser'],['A keyboard','Una tastiera'],['A monitor','Un monitor'],['A CPU','Una CPU']],why:['A browser is a program.','Un browser è un programma.']},
   {q:['In the von Neumann architecture, the central memory holds…','Nell\'architettura di von Neumann, la memoria centrale contiene…'],a:[['Both programs and data','Sia i programmi sia i dati'],['Only data','Solo i dati'],['Only the operating system','Solo il sistema operativo'],['Nothing: it is just a cable','Niente: è solo un cavo']],why:['Storing the program in memory is the key idea.','Mettere il programma in memoria è l\'idea chiave.']},
   {q:['What connects the CPU, memory and I/O in von Neumann\'s design?','Cosa collega CPU, memoria e I/O nello schema di von Neumann?'],a:[['The bus','Il bus'],['The monitor','Il monitor'],['The keyboard','La tastiera'],['The internet','Internet']],why:['Buses carry data, addresses and control signals.','I bus trasportano dati, indirizzi e segnali di controllo.']},
   {q:['What is the correct order of the cycle?','Qual è l\'ordine corretto del ciclo?'],a:[['Input → Processing → Output','Input → Elaborazione → Output'],['Output → Input → Processing','Output → Input → Elaborazione'],['Processing → Output → Input','Elaborazione → Output → Input'],['Input → Output → Processing','Input → Output → Elaborazione']],why:['Data comes in, is processed, then results go out.','I dati entrano, vengono elaborati, poi escono i risultati.']},
   {q:['You speak into a microphone on a video call. That is…','Parli nel microfono durante una videochiamata. È…'],a:[['Input','Input'],['Output','Output'],['Processing','Elaborazione'],['Storage','Memorizzazione']],why:['Your voice goes INTO the computer.','La tua voce ENTRA nel computer.']},
  ]},
{ id:'a3m2', arc:2, sec:'3.3–3.4', pages:'52–55', hue:20, horns:3, eyes:2,
  title:['The Core Flame: Motherboard & CPU','La fiamma del nucleo: scheda madre e CPU'], topic:['Motherboard, CPU, fetch–decode–execute','Scheda madre, CPU, ciclo fetch–decode–execute'],
  demon:['Lag Oni','Oni del Lag'], tech:['Circuit Form · Second Technique: Fetch-Decode-Execute Strike','Stile del Circuito · Seconda Tecnica: Colpo Fetch-Decode-Execute'],
  scenes:[
   {who:'s', vis:'board', init:'board', text:[`<p>The [[motherboard|scheda madre]] is the main circuit board. Every part plugs into it, and it connects them all so they can work as one team.</p><p>Tap the parts of the board to learn each one.</p>`,`<p>La [[motherboard|scheda madre]] è il circuito principale. Ogni componente si collega a lei, ed è lei che li unisce perché lavorino come una squadra.</p><p>Tocca le parti della scheda per conoscerle.</p>`]},
   {who:'s', vis:'psu', text:[`<p>The [[power supply unit|alimentatore]] (PSU) feeds the team. The wall socket gives alternating current (AC) at about 230 V in Italy; the parts need low-voltage direct current (DC). The PSU converts it.</p>`,`<p>L'[[power supply unit|alimentatore]] (PSU) dà energia alla squadra. La presa di casa fornisce corrente alternata (AC) a circa 230 V; i componenti hanno bisogno di corrente continua (DC) a bassa tensione. L'alimentatore la converte.</p>`]},
   {who:'s', vis:'cpu', text:[`<p>The [[CPU|CPU]] or [[microprocessor|microprocessore]] is the brain. It carries out the instructions of every program. Inside it:</p><p>[[Control Unit|unità di controllo]] (CU): reads each instruction, works out what it means, and directs the others.<br>[[ALU|ALU]]: does the maths (+ − × ÷) and comparisons.<br>[[Registers|registri]]: tiny, super-fast memory cells for the data in use right now.</p>`,
     `<p>La [[CPU|CPU]], o [[microprocessor|microprocessore]], è il cervello. Esegue le istruzioni di ogni programma. Al suo interno:</p><p>[[Control Unit|unità di controllo]] (CU): legge ogni istruzione, capisce cosa significa e coordina le altre parti.<br>[[ALU|ALU]] (unità aritmetico-logica): fa i calcoli (+ − × ÷) e i confronti.<br>[[Registers|registri]]: piccolissime celle di memoria velocissime per i dati in uso in quel momento.</p>`]},
   {type:'fde'},
   {who:'s', vis:'cores', text:[`<p>Two numbers describe a CPU's power: [[clock speed|frequenza di clock]], in GHz (billions of cycles per second), and the number of [[cores|core]]. More cores = more instructions running in parallel.</p><p>The CPU gets hot, so it sits under a [[heat sink|dissipatore]] and a [[fan|ventola]].</p>`,`<p>Due numeri descrivono la potenza di una CPU: la [[clock speed|frequenza di clock]], in GHz (miliardi di cicli al secondo), e il numero di [[cores|core]]. Più core = più istruzioni eseguite in parallelo.</p><p>La CPU si scalda, quindi è coperta da un [[heat sink|dissipatore]] con una [[fan|ventola]].</p>`]},
   {type:'build'},
   {who:'d', vis:'demon', text:[`<p>Grrrr… I am the Lag Oni. I make every program sloooow!</p>`,`<p>Grrrr… Sono l'Oni del Lag. Rendo ogni programma leeeento!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['What is the motherboard\'s main job?','Qual è il compito principale della scheda madre?'],a:[['To connect all the components','Collegare tutti i componenti'],['To store your files','Conservare i tuoi file'],['To show images','Mostrare le immagini'],['To cool the CPU','Raffreddare la CPU']],why:['Everything plugs into the motherboard.','Tutto si collega alla scheda madre.']},
   {q:['What does CPU stand for?','Cosa significa CPU?'],a:[['Central Processing Unit','Central Processing Unit (unità centrale di elaborazione)'],['Computer Power Unit','Computer Power Unit'],['Central Program Utility','Central Program Utility'],['Core Printing Unit','Core Printing Unit']],why:['CPU = Central Processing Unit.','CPU = Central Processing Unit, unità centrale di elaborazione.']},
   {q:['Which part of the CPU does calculations and comparisons?','Quale parte della CPU fa calcoli e confronti?'],a:[['ALU','ALU'],['Control Unit','Unità di controllo'],['Clock','Clock'],['Fan','Ventola']],why:['ALU = Arithmetic Logic Unit.','ALU = unità aritmetico-logica.']},
   {q:['What is the correct order of the CPU cycle?','Qual è l\'ordine corretto del ciclo della CPU?'],a:[['Fetch → Decode → Execute','Fetch → Decode → Execute (prelievo → decodifica → esecuzione)'],['Decode → Fetch → Execute','Decode → Fetch → Execute'],['Execute → Fetch → Decode','Execute → Fetch → Decode'],['Fetch → Execute → Decode','Fetch → Execute → Decode']],why:['Get the instruction, understand it, do it. Repeat.','Prendi l\'istruzione, capiscila, eseguila. Ripeti.']},
   {q:['A CPU runs at 3 GHz. That means about…','Una CPU va a 3 GHz. Significa circa…'],a:[['3 billion cycles per second','3 miliardi di cicli al secondo'],['3 programs at once','3 programmi insieme'],['3 GB of memory','3 GB di memoria'],['3 cores','3 core']],why:['Giga = billion; hertz = per second.','Giga = miliardo; hertz = al secondo.']},
   {q:['What does the power supply (PSU) do?','Cosa fa l\'alimentatore?'],a:[['Converts AC from the wall into low-voltage DC','Converte la corrente alternata della presa in continua a bassa tensione'],['Processes instructions','Esegue le istruzioni'],['Draws graphics','Disegna la grafica'],['Stores the BIOS','Conserva il BIOS']],why:['Components need DC at low voltages.','I componenti hanno bisogno di corrente continua a bassa tensione.']},
   {q:['Why does a CPU need a heat sink and fan?','Perché la CPU ha bisogno di dissipatore e ventola?'],a:[['To stop it overheating','Per evitare che si surriscaldi'],['To make it lighter','Per renderla più leggera'],['To store data','Per salvare dati'],['To connect the monitor','Per collegare il monitor']],why:['Heat slows the CPU down or makes it shut off.','Il calore rallenta la CPU o la fa spegnere.']},
  ]},
{ id:'a3m3', arc:2, sec:'3.5–3.7', pages:'56–63', hue:280, horns:2, eyes:3,
  title:['Memory Palace: RAM, Bus & Storage','Il palazzo della memoria: RAM, bus e memoria di massa'], topic:['RAM, ROM, cache, buses, mass storage','RAM, ROM, cache, bus, memoria di massa'],
  demon:['Amnesia Wraith','Spettro dell\'Amnesia'], tech:['Circuit Form · Third Technique: Cache Flash Step','Stile del Circuito · Terza Tecnica: Passo Lampo della Cache'],
  scenes:[
   {who:'s', vis:'ramstick', text:[`<p>[[RAM|RAM]] (Random Access Memory) is the CPU's workbench. Every program and file you have <b>open right now</b> is copied into RAM, because it is much faster than storage. More RAM = more things open without slowing down.</p>`,`<p>La [[RAM|RAM]] (Random Access Memory) è il banco di lavoro della CPU. Ogni programma e file <b>aperto in questo momento</b> viene copiato in RAM, perché è molto più veloce della memoria di massa. Più RAM = più cose aperte senza rallentare.</p>`]},
   {who:'s', vis:'powercut', init:'powercut', needDone:true, text:[`<p>RAM's weakness: it is [[volatile|volatile]]. It <b>forgets everything when the power goes off</b>. Mass storage is [[non-volatile|non volatile]]: it keeps data with no power.</p><p>Try it: cut the power, then turn it back on.</p>`,`<p>Il punto debole della RAM: è [[volatile|volatile]]. <b>Dimentica tutto quando manca la corrente</b>. La memoria di massa è [[non-volatile|non volatile]]: conserva i dati anche senza corrente.</p><p>Prova: togli la corrente, poi riaccendi.</p>`]},
   {who:'s', vis:'pyramid', text:[`<p>[[Cache|cache]] is a small, very fast memory on the CPU chip that keeps copies of data used often.</p><p>[[ROM|ROM]] (Read-Only Memory) is non-volatile and holds the firmware (BIOS/UEFI) that starts the computer. In modern PCs it is usually a flash chip that can be updated.</p>`,`<p>La [[Cache|cache]] è una memoria piccola e velocissima sul chip della CPU, che tiene copie dei dati usati spesso.</p><p>La [[ROM|ROM]] (Read-Only Memory, memoria di sola lettura) è non volatile e contiene il firmware (BIOS/UEFI) che avvia il computer. Nei PC moderni di solito è un chip flash aggiornabile.</p>`]},
   {who:'s', vis:'buses', text:[`<p>The [[bus|bus]] is the set of connections that moves data between CPU, memory and devices. There are three kinds:</p><p>[[data bus|bus dati]]: carries the data. [[address bus|bus indirizzi]]: says <i>where</i> in memory. [[control bus|bus di controllo]]: says <i>what</i> to do (read or write). A wider bus (e.g. 64 bits) moves more data at once.</p>`,
     `<p>Il [[bus|bus]] è l'insieme dei collegamenti che trasferisce i dati tra CPU, memoria e periferiche. Ne esistono tre tipi:</p><p>[[data bus|bus dati]]: trasporta i dati. [[address bus|bus indirizzi]]: indica <i>dove</i> in memoria. [[control bus|bus di controllo]]: indica <i>cosa</i> fare (leggere o scrivere). Un bus più largo (es. 64 bit) trasporta più dati alla volta.</p>`]},
   {who:'s', vis:'hdd', text:[`<p>[[Mass storage|memoria di massa]] keeps files, apps and the operating system when the computer is off.</p><p>[[HDD|disco rigido]]: data stored <b>magnetically</b> on spinning platters, read by a moving head. Big and cheap, but slower.<br>[[SSD|SSD]]: <b>flash memory</b> chips, no moving parts. Faster, quieter, tougher.</p>`,`<p>La [[Mass storage|memoria di massa]] conserva file, app e sistema operativo quando il computer è spento.</p><p>[[HDD|disco rigido]] (HDD): dati salvati in modo <b>magnetico</b> su piatti rotanti, letti da una testina mobile. Capiente ed economico, ma più lento.<br>[[SSD|SSD]]: chip di <b>memoria flash</b>, nessuna parte mobile. Più veloce, silenzioso e resistente.</p>`]},
   {who:'s', vis:'optcloud', text:[`<p>[[Optical discs|dischi ottici]] (CD, DVD, Blu-ray) are read by a <b>laser</b>. [[Cloud storage|archiviazione cloud]] keeps your files on remote servers you reach over the internet.</p>`,`<p>I [[Optical discs|dischi ottici]] (CD, DVD, Blu-ray) si leggono con un <b>laser</b>. L'[[Cloud storage|archiviazione cloud]] tiene i tuoi file su server remoti raggiungibili via internet.</p>`]},
   {type:'sort', title:['Volatile or non-volatile?','Volatile o non volatile?'], cats:[['Volatile','Volatile'],['Non-volatile','Non volatile']], items:[
     {n:['RAM','RAM'],i:'ram',c:0,why:['RAM forgets everything without power.','La RAM dimentica tutto senza corrente.']},
     {n:['SSD','SSD'],i:'ssd',c:1,why:['An SSD keeps files with no power.','L\'SSD conserva i file senza corrente.']},
     {n:['ROM (firmware chip)','ROM (chip del firmware)'],i:'chip',c:1,why:['ROM keeps the start-up firmware.','La ROM conserva il firmware di avvio.']},
     {n:['Cache','Cache'],i:'chip',c:0,why:['Cache is very fast RAM: volatile.','La cache è RAM velocissima: volatile.']},
     {n:['Hard disk (HDD)','Hard disk (HDD)'],i:'hdd',c:1,why:['Magnetic storage keeps data.','La memoria magnetica conserva i dati.']},
     {n:['USB flash drive','Chiavetta USB'],i:'usb',c:1,why:['Flash memory keeps data.','La memoria flash conserva i dati.']},
     {n:['CPU registers','Registri della CPU'],i:'chip',c:0,why:['Registers only work while powered.','I registri funzionano solo con la corrente.']},
     {n:['DVD','DVD'],i:'disc',c:1,why:['Optical discs keep data with no power.','I dischi ottici conservano i dati senza corrente.']}]},
   {who:'d', vis:'demon', text:[`<p>Whoooo… I am the Amnesia Wraith. I'll pull the plug and your unsaved work will vanish!</p>`,`<p>Uuuuh… Sono lo Spettro dell'Amnesia. Staccherò la spina e il tuo lavoro non salvato sparirà!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['What does "volatile" mean?','Cosa significa "volatile"?'],a:[['It loses its data when the power is off','Perde i dati quando manca la corrente'],['It is very fast','È molto veloce'],['It can never change','Non può mai cambiare'],['It is online','È online']],why:['RAM is volatile.','La RAM è volatile.']},
   {q:['The power cuts out and your unsaved essay is gone. Why?','Va via la corrente e il tema non salvato sparisce. Perché?'],a:[['It was only in RAM','Era solo in RAM'],['The CPU deleted it','L\'ha cancellato la CPU'],['The monitor was off','Il monitor era spento'],['The ROM erased it','L\'ha cancellato la ROM']],why:['Save to mass storage to keep your work.','Salva sulla memoria di massa per conservare il lavoro.']},
   {q:['What does ROM usually contain?','Cosa contiene di solito la ROM?'],a:[['The start-up firmware (BIOS/UEFI)','Il firmware di avvio (BIOS/UEFI)'],['Your photos','Le tue foto'],['Open browser tabs','Le schede del browser aperte'],['The internet','Internet']],why:['Firmware starts the computer.','Il firmware avvia il computer.']},
   {q:['Which list goes from FASTEST to SLOWEST?','Quale elenco va dal PIÙ VELOCE al PIÙ LENTO?'],a:[['Registers → Cache → RAM → Mass storage','Registri → Cache → RAM → Memoria di massa'],['Mass storage → RAM → Cache → Registers','Memoria di massa → RAM → Cache → Registri'],['RAM → Registers → Storage → Cache','RAM → Registri → Memoria di massa → Cache'],['Cache → Storage → RAM → Registers','Cache → Memoria di massa → RAM → Registri']],why:['Closer to the CPU = faster and smaller.','Più vicino alla CPU = più veloce e più piccolo.']},
   {q:['Which bus says WHERE in memory to read or write?','Quale bus indica DOVE leggere o scrivere in memoria?'],a:[['Address bus','Bus indirizzi'],['Data bus','Bus dati'],['Control bus','Bus di controllo'],['School bus','Scuolabus']],why:['The address bus carries memory addresses.','Il bus indirizzi trasporta gli indirizzi di memoria.']},
   {q:['How does a hard disk (HDD) store data?','Come salva i dati un hard disk (HDD)?'],a:[['Magnetically on spinning platters','In modo magnetico su piatti rotanti'],['With a laser','Con un laser'],['In flash chips','In chip flash'],['On remote servers','Su server remoti']],why:['A head reads magnetic tracks on the platters.','Una testina legge le tracce magnetiche sui piatti.']},
   {q:['Why is an SSD faster than an HDD?','Perché un SSD è più veloce di un HDD?'],a:[['It has no moving parts','Non ha parti mobili'],['It spins faster','Gira più veloce'],['It is bigger','È più grande'],['It uses a laser','Usa un laser']],why:['No waiting for platters to spin or heads to move.','Non deve aspettare che i piatti girino o la testina si sposti.']},
  ]},
{ id:'a3m4', arc:2, sec:'3.8–3.9 + CLIL', pages:'64–71', hue:320, horns:3, eyes:4,
  title:['Signals: Peripherals & Touchscreens','Segnali: periferiche e touchscreen'], topic:['Input/output devices, touchscreens, e-waste, Moore\'s law','Periferiche di input e output, touchscreen, RAEE, legge di Moore'],
  demon:['Ghost Signal','Segnale Fantasma'], tech:['Circuit Form · Fourth Technique: I/O Twin Strike','Stile del Circuito · Quarta Tecnica: Doppio Colpo I/O'],
  scenes:[
   {who:'s', vis:'ioflow', text:[`<p>[[Peripherals|periferiche]] are the devices connected to the computer.</p><p>[[Input devices|periferiche di input]] send data <b>in</b>: keyboard, mouse, microphone, webcam, scanner, sensors.<br>[[Output devices|periferiche di output]] send results <b>out</b>: monitor, speakers, printer, projector, headphones.</p>`,`<p>Le [[Peripherals|periferiche]] sono i dispositivi collegati al computer.</p><p>Le [[Input devices|periferiche di input]] fanno <b>entrare</b> dati: tastiera, mouse, microfono, webcam, scanner, sensori.<br>Le [[Output devices|periferiche di output]] fanno <b>uscire</b> i risultati: monitor, casse, stampante, proiettore, cuffie.</p>`]},
   {who:'s', vis:'both', text:[`<p>Some devices are <b>input and output</b> at the same time. And many objects hide a computer inside: in a robot, [[sensors|sensori]] are inputs while motors and lights are outputs.</p>`,`<p>Alcuni dispositivi sono <b>di input e di output</b> insieme. E molti oggetti nascondono un computer: in un robot i [[sensors|sensori]] sono input, mentre motori e luci sono output.</p>`]},
   {who:'s', vis:'touch', text:[`<p>How does a [[touchscreen|touchscreen]] work? Most phones use a <b>capacitive</b> screen: an invisible grid of electrodes holds a tiny electric charge. Your finger conducts electricity, so it changes the charge at that point. The controller works out the coordinates and sends them to the CPU.</p><p>That's why it doesn't work with normal gloves!</p>`,
     `<p>Come funziona un [[touchscreen|touchscreen]]? Quasi tutti i telefoni usano uno schermo <b>capacitivo</b>: una griglia invisibile di elettrodi mantiene una piccola carica elettrica. Il dito conduce elettricità e modifica la carica in quel punto. Il controller calcola le coordinate e le invia alla CPU.</p><p>Ecco perché non funziona con i guanti normali!</p>`]},
   {who:'s', vis:'earth', text:[`<p>Two more pages from your book. Old computers are [[e-waste|RAEE]] and must go to a proper collection point, so precious metals are recovered and toxic parts don't pollute.</p><p>[[Moore's law|legge di Moore]] (CLIL p. 71): for decades, the number of transistors on a chip doubled about every two years. Today chips are so tiny that this growth is slowing down.</p>`,
     `<p>Altre due pagine del tuo libro. I vecchi computer sono [[e-waste|RAEE]] (rifiuti elettronici) e vanno portati nei centri di raccolta, così si recuperano i metalli preziosi e le parti tossiche non inquinano.</p><p>La [[Moore's law|legge di Moore]] (CLIL p. 71): per decenni il numero di transistor su un chip è raddoppiato circa ogni due anni. Oggi i chip sono così piccoli che questa crescita sta rallentando.</p>`]},
   {type:'journey'},
   {type:'sort', title:['Input, output or both?','Input, output o entrambi?'], cats:[['Input','Input'],['Output','Output'],['Both','Entrambi']], items:[
     {n:['Keyboard','Tastiera'],i:'keyboard',c:0,why:['Key presses go IN.','I tasti premuti ENTRANO.']},
     {n:['Monitor','Monitor'],i:'monitor',c:1,why:['It shows results: OUT.','Mostra i risultati: ESCONO.']},
     {n:['Microphone','Microfono'],i:'mic',c:0,why:['Your voice goes IN.','La tua voce ENTRA.']},
     {n:['Speakers','Casse'],i:'speaker',c:1,why:['Sound comes OUT.','Il suono ESCE.']},
     {n:['Touchscreen','Touchscreen'],i:'touch',c:2,why:['Touch = input, display = output.','Tocco = input, immagine = output.']},
     {n:['Printer','Stampante'],i:'printer',c:1,why:['Results go onto paper.','I risultati finiscono su carta.']},
     {n:['Webcam','Webcam'],i:'webcam',c:0,why:['Video goes IN.','Il video ENTRA.']},
     {n:['Headset with microphone','Cuffie con microfono'],i:'headset',c:2,why:['Mic in, sound out.','Microfono dentro, suono fuori.']},
     {n:['Temperature sensor','Sensore di temperatura'],i:'sensor',c:0,why:['It measures the world: IN.','Misura il mondo: ENTRA.']},
     {n:['Projector','Proiettore'],i:'projector',c:1,why:['Images go OUT onto a wall.','Le immagini ESCONO sul muro.']}]},
   {who:'d', vis:'demon', text:[`<p>Ooooo… I am the Ghost Signal. I twist every signal backwards!</p>`,`<p>Ooooh… Sono il Segnale Fantasma. Rovescio ogni segnale!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['Which of these is an OUTPUT device?','Quale di queste è una periferica di OUTPUT?'],a:[['Printer','Stampante'],['Keyboard','Tastiera'],['Scanner','Scanner'],['Microphone','Microfono']],why:['A printer puts results onto paper.','La stampante porta i risultati su carta.']},
   {q:['A touchscreen is…','Un touchscreen è…'],a:[['Both input and output','Sia input sia output'],['Only input','Solo input'],['Only output','Solo output'],['Storage','Memoria di massa']],why:['It senses touch and displays images.','Rileva il tocco e mostra immagini.']},
   {q:['How does a capacitive touchscreen detect your finger?','Come rileva il dito un touchscreen capacitivo?'],a:[['Your finger changes the electric charge on a grid of electrodes','Il dito modifica la carica elettrica su una griglia di elettrodi'],['A camera films your finger','Una telecamera riprende il dito'],['It measures your finger\'s temperature','Misura la temperatura del dito'],['It hears the tap','Sente il rumore del tocco']],why:['That is why normal gloves don\'t work: they don\'t conduct.','Per questo i guanti normali non funzionano: non conducono.']},
   {q:['What should you do with an old computer?','Cosa devi fare con un vecchio computer?'],a:[['Take it to an e-waste (RAEE) collection point','Portarlo in un centro di raccolta RAEE'],['Put it in the normal rubbish','Buttarlo nell\'indifferenziato'],['Burn it','Bruciarlo'],['Bury it in the garden','Seppellirlo in giardino']],why:['Recycling recovers metals and stops pollution.','Il riciclo recupera i metalli ed evita l\'inquinamento.']},
   {q:['Moore\'s law says that…','La legge di Moore dice che…'],a:[['Transistors on a chip doubled about every 2 years','I transistor su un chip raddoppiavano circa ogni 2 anni'],['Computers get heavier every year','I computer diventano più pesanti ogni anno'],['Internet speed halves every year','La velocità di internet si dimezza ogni anno'],['Screens double in size every month','Gli schermi raddoppiano ogni mese']],why:['It is an observation, now slowing down.','È un\'osservazione, che oggi sta rallentando.']},
   {q:['A temperature sensor in a smart thermostat is…','Un sensore di temperatura in un termostato smart è…'],a:[['An input','Un input'],['An output','Un output'],['Software','Software'],['Storage','Memoria di massa']],why:['Sensors send measurements IN.','I sensori inviano misure IN ENTRATA.']},
  ]},

/* ================= ARC 4 ================= */
{ id:'a4m1', arc:3, sec:'4.1–4.2', pages:'72–75', hue:100, horns:2, eyes:2,
  title:['The Headmaster: Operating System','Il preside: il sistema operativo'], topic:['What the OS does; programs and processes','Cosa fa il sistema operativo; programmi e processi'],
  demon:['Driverless Phantom','Fantasma Senza Driver'], tech:['Kernel Form · First Technique: System Barrier','Stile del Kernel · Prima Tecnica: Barriera di Sistema'],
  scenes:[
   {who:'s', vis:'stack', text:[`<p>Software works in layers. You use <b>applications</b>; applications ask the [[operating system|sistema operativo]] for help; the OS uses [[drivers|driver]] to control the <b>hardware</b>.</p><p>Windows, macOS, Linux, Android and iOS are all operating systems.</p>`,`<p>Il software lavora a strati. Tu usi le <b>applicazioni</b>; le applicazioni chiedono aiuto al [[operating system|sistema operativo]]; il sistema operativo usa i [[drivers|driver]] per controllare l'<b>hardware</b>.</p><p>Windows, macOS, Linux, Android e iOS sono tutti sistemi operativi.</p>`]},
   {who:'s', vis:'osjobs', text:[`<p>The OS is the academy's headmaster. It organises everything so programs and users don't get in each other's way. Its jobs:</p>`,`<p>Il sistema operativo è il preside dell'accademia. Organizza tutto perché programmi e utenti non si intralcino. Ecco i suoi compiti:</p>`]},
   {who:'s', vis:'process', text:[`<p>A [[program|programma]] is a file of instructions resting on the disk. When you run it, it is loaded into RAM and becomes a [[process|processo]].</p><p>The OS [[scheduler|scheduler]] gives each process a tiny slice of CPU time, switching so fast that everything seems to run at once. That's [[multitasking|multitasking]].</p>`,`<p>Un [[program|programma]] è un file di istruzioni fermo sul disco. Quando lo avvii, viene caricato in RAM e diventa un [[process|processo]].</p><p>Lo [[scheduler|scheduler]] del sistema operativo dà a ogni processo una piccolissima fetta di tempo della CPU, cambiando così in fretta che tutto sembra funzionare insieme. È il [[multitasking|multitasking]].</p>`]},
   {type:'order', title:['What happens when you open an app?','Cosa succede quando apri un\'app?'], steps:[['You double-click the app icon','Fai doppio clic sull\'icona dell\'app'],['The OS finds the program file on the disk','Il sistema operativo trova il file del programma sul disco'],['The OS copies the program into RAM','Il sistema operativo copia il programma in RAM'],['The program becomes a process','Il programma diventa un processo'],['The scheduler gives it turns on the CPU','Lo scheduler gli assegna turni sulla CPU'],['The app\'s window appears','Compare la finestra dell\'app']], hint:['A program must be in RAM before the CPU can run it.','Un programma deve essere in RAM prima che la CPU possa eseguirlo.']},
   {who:'d', vis:'demon', text:[`<p>Hssss… I am the Driverless Phantom. I delete drivers so the OS can't talk to anything!</p>`,`<p>Hssss… Sono il Fantasma Senza Driver. Cancello i driver così il sistema operativo non parla più con niente!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['Which of these is an operating system?','Quale di questi è un sistema operativo?'],a:[['Linux','Linux'],['A spreadsheet','Un foglio di calcolo'],['A printer','Una stampante'],['A web page','Una pagina web']],why:['Linux, Windows, macOS, Android, iOS are operating systems.','Linux, Windows, macOS, Android e iOS sono sistemi operativi.']},
   {q:['Which is NOT a job of the operating system?','Quale NON è un compito del sistema operativo?'],a:[['Writing your essay for you','Scrivere il tema al posto tuo'],['Managing memory','Gestire la memoria'],['Managing files','Gestire i file'],['Running several programs at once','Far funzionare più programmi insieme']],why:['Writing is your job, with an application.','Scrivere è compito tuo, con un\'applicazione.']},
   {q:['What is a process?','Che cos\'è un processo?'],a:[['A program while it is running','Un programma in esecuzione'],['A file on a USB stick','Un file su una chiavetta'],['A type of cable','Un tipo di cavo'],['A broken program','Un programma rotto']],why:['A program becomes a process when it is loaded into RAM and runs.','Un programma diventa processo quando è caricato in RAM e viene eseguito.']},
   {q:['Multitasking means…','Multitasking significa…'],a:[['The OS shares the CPU so several processes seem to run at once','Il sistema operativo divide la CPU e più processi sembrano funzionare insieme'],['Having two keyboards','Avere due tastiere'],['Turning the computer on and off','Accendere e spegnere il computer'],['Using only one program','Usare un solo programma']],why:['The scheduler switches between processes very quickly.','Lo scheduler passa da un processo all\'altro velocissimamente.']},
   {q:['What is a device driver?','Che cos\'è un driver?'],a:[['A program that lets the OS talk to a specific device','Un programma che permette al sistema operativo di comunicare con un dispositivo'],['A person who fixes computers','Una persona che ripara computer'],['A cable','Un cavo'],['A type of RAM','Un tipo di RAM']],why:['Drivers translate between the OS and hardware.','I driver fanno da traduttori tra sistema operativo e hardware.']},
   {q:['Before the CPU can run a program, the program must be…','Prima che la CPU possa eseguire un programma, il programma deve essere…'],a:[['Loaded into RAM','Caricato in RAM'],['Printed','Stampato'],['Deleted','Cancellato'],['Sent by email','Inviato per e-mail']],why:['The CPU fetches instructions from RAM.','La CPU preleva le istruzioni dalla RAM.']},
  ]},
{ id:'a4m2', arc:3, sec:'4.3–4.5', pages:'76–84', hue:180, horns:3, eyes:2,
  title:['The Archive: Files, Folders & GUI','L\'archivio: file, cartelle e interfaccia'], topic:['File system, graphical interface, working with files','File system, interfaccia grafica, operare su file e cartelle'],
  demon:['Lost-File Yokai','Yokai dei File Perduti'], tech:['Kernel Form · Second Technique: Path Tracker','Stile del Kernel · Seconda Tecnica: Segugio del Percorso'],
  scenes:[
   {who:'s', vis:'tree', text:[`<p>The [[file system|file system]] is how the OS organises data on the disk. Data lives in [[files|file]], and files live in [[folders|cartelle]] arranged as a tree.</p><p>The [[path|percorso]] is the address of a file. The [[extension|estensione]] after the dot says what type of file it is: .docx, .jpg, .mp3…</p>`,`<p>Il [[file system|file system]] è il modo in cui il sistema operativo organizza i dati sul disco. I dati stanno nei [[files|file]], e i file stanno nelle [[folders|cartelle]], disposte ad albero.</p><p>Il [[path|percorso]] è l'indirizzo di un file. L'[[extension|estensione]] dopo il punto dice che tipo di file è: .docx, .jpg, .mp3…</p>`]},
   {who:'s', vis:'gui', text:[`<p>A [[graphical user interface|interfaccia grafica]] (GUI) lets you use the computer by clicking and tapping instead of typing commands. It is built from four elements, sometimes called <b>WIMP</b>: Windows, Icons, Menus, Pointer.</p>`,`<p>L'[[graphical user interface|interfaccia grafica]] (GUI) ti permette di usare il computer cliccando e toccando, invece di scrivere comandi. È fatta di quattro elementi, detti a volte <b>WIMP</b>: finestre (Windows), icone, menu e puntatore.</p>`]},
   {who:'s', vis:'fileops', text:[`<p>Working with files and folders: create, rename, [[copy|copia]], [[move|sposta]], delete. Copy leaves the original in place; move takes it away. Deleted files go to the [[Recycle Bin|Cestino]] first.</p>`,`<p>Operare su file e cartelle: crea, rinomina, [[copy|copia]], [[move|sposta]], elimina. Copiare lascia l'originale al suo posto; spostare lo porta via. I file eliminati finiscono prima nel [[Recycle Bin|Cestino]].</p>`]},
   {type:'sort', title:['What type of file is it?','Che tipo di file è?'], cats:[['Document','Documento'],['Image','Immagine'],['Audio','Audio'],['Video','Video']], items:[
     {n:['essay.docx','tema.docx'],i:'file',c:0,why:['.docx = word processor document.','.docx = documento di videoscrittura.']},
     {n:['holiday.jpg','vacanze.jpg'],i:'image',c:1,why:['.jpg = photo (lossy image).','.jpg = foto (immagine con perdita).']},
     {n:['song.mp3','canzone.mp3'],i:'music',c:2,why:['.mp3 = compressed audio.','.mp3 = audio compresso.']},
     {n:['trailer.mp4','trailer.mp4'],i:'video',c:3,why:['.mp4 = video.','.mp4 = video.']},
     {n:['notes.txt','appunti.txt'],i:'file',c:0,why:['.txt = plain text.','.txt = testo semplice.']},
     {n:['screenshot.png','screenshot.png'],i:'image',c:1,why:['.png = image (lossless).','.png = immagine (senza perdita).']},
     {n:['report.pdf','relazione.pdf'],i:'file',c:0,why:['.pdf = document that looks the same everywhere.','.pdf = documento che appare uguale ovunque.']},
     {n:['voice.wav','voce.wav'],i:'mic',c:2,why:['.wav = uncompressed audio.','.wav = audio non compresso.']}]},
   {who:'d', vis:'demon', text:[`<p>Hihihi… I'm the Lost-File Yokai. I hide your homework in folders you'll never find!</p>`,`<p>Ihihih… Sono lo Yokai dei File Perduti. Nascondo i tuoi compiti in cartelle che non troverai mai!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['What does the file system do?','Cosa fa il file system?'],a:[['Organises files and folders on the disk','Organizza file e cartelle sul disco'],['Cools the computer','Raffredda il computer'],['Connects to Wi-Fi','Si collega al Wi-Fi'],['Prints documents','Stampa documenti']],why:['It is the OS\'s filing cabinet.','È l\'archivio del sistema operativo.']},
   {q:['In "foto.jpg", what is "jpg"?','In "foto.jpg", che cos\'è "jpg"?'],a:[['The extension (file type)','L\'estensione (tipo di file)'],['The folder','La cartella'],['The path','Il percorso'],['The size','La dimensione']],why:['The extension tells the OS which program opens the file.','L\'estensione dice al sistema operativo quale programma apre il file.']},
   {q:['What is a path like C:\\Users\\Hana\\Documents\\essay.docx?','Che cos\'è un percorso come C:\\Utenti\\Hana\\Documenti\\tema.docx?'],a:[['The address of the file in the folder tree','L\'indirizzo del file nell\'albero delle cartelle'],['A web link','Un link web'],['A password','Una password'],['A virus','Un virus']],why:['It lists every folder from the root down to the file.','Elenca ogni cartella dalla radice fino al file.']},
   {q:['What is the difference between copy and move?','Che differenza c\'è tra copiare e spostare?'],a:[['Copy keeps the original; move takes it away','Copiare mantiene l\'originale; spostare lo porta via'],['There is no difference','Nessuna differenza'],['Move makes two copies','Spostare crea due copie'],['Copy deletes the file','Copiare cancella il file']],why:['Move = cut + paste.','Spostare = taglia + incolla.']},
   {q:['What does GUI stand for?','Cosa significa GUI?'],a:[['Graphical User Interface','Graphical User Interface (interfaccia grafica)'],['General Unit Input','General Unit Input'],['Great Useful Internet','Great Useful Internet'],['Graphics Upload Icon','Graphics Upload Icon']],why:['Windows, icons, menus and pointer.','Finestre, icone, menu e puntatore.']},
   {q:['You delete a file by mistake. Where can you often find it?','Elimini un file per errore. Dove puoi spesso ritrovarlo?'],a:[['In the Recycle Bin','Nel Cestino'],['In the CPU','Nella CPU'],['In the printer','Nella stampante'],['It is gone forever','È perso per sempre']],why:['Until you empty the bin, you can restore it.','Finché non svuoti il Cestino, puoi ripristinarlo.']},
  ]},
{ id:'a4m3', arc:3, sec:'4.6–4.9 + CLIL', pages:'85–99', hue:15, horns:4, eyes:2,
  title:['Apps, Sensors & Licences','App, sensori e licenze'], topic:['Application software, mobile apps, accelerometer, GNSS, copyright, open source','Software applicativo, app, accelerometro, GNSS, copyright, open source'],
  demon:['Pirate Oni','Oni Pirata'], tech:['Kernel Form · Third Technique: Licence Seal','Stile del Kernel · Terza Tecnica: Sigillo della Licenza'],
  scenes:[
   {who:'s', vis:'apps', text:[`<p>[[Application software|software applicativo]] helps <b>you</b> do a task: write, calculate, draw, play, learn. [[Mobile apps|app per dispositivi mobili]] are applications built for phones and tablets, downloaded from an app store.</p>`,`<p>Il [[Application software|software applicativo]] aiuta <b>te</b> a svolgere un compito: scrivere, calcolare, disegnare, giocare, imparare. Le [[Mobile apps|app per dispositivi mobili]] sono applicazioni pensate per telefoni e tablet, scaricate da uno store.</p>`]},
   {who:'s', vis:'sensors', text:[`<p>Phones are full of sensors. The [[accelerometer|accelerometro]] measures movement and tilt: it rotates the screen and counts your steps.</p><p>The [[GNSS receiver|ricevitore GNSS]] (Global Navigation Satellite System) picks up signals from satellites (GPS, Europe's Galileo and others) and uses at least four to calculate where you are.</p>`,`<p>I telefoni sono pieni di sensori. L'[[accelerometer|accelerometro]] misura movimento e inclinazione: ruota lo schermo e conta i passi.</p><p>Il [[GNSS receiver|ricevitore GNSS]] (sistema satellitare globale di navigazione) riceve i segnali dei satelliti (GPS, l'europeo Galileo e altri) e ne usa almeno quattro per calcolare dove ti trovi.</p>`]},
   {who:'s', vis:'licences', text:[`<p>Software is protected by [[copyright|diritto d'autore]]. When you install it you accept a [[licence|licenza d'uso]] that says what you may do. Copying paid software without permission is piracy, and it's illegal.</p><p>[[Open source|open source]] software (CLIL p. 99) publishes its source code so anyone can study, improve and share it.</p>`,`<p>Il software è protetto dal [[copyright|diritto d'autore]]. Quando lo installi accetti una [[licence|licenza d'uso]] che dice cosa puoi farci. Copiare software a pagamento senza permesso è pirateria, ed è illegale.</p><p>Il software [[Open source|open source]] (CLIL p. 99) pubblica il codice sorgente: chiunque può studiarlo, migliorarlo e condividerlo.</p>`]},
   {type:'sort', title:['Which kind of licence?','Che tipo di licenza?'], cats:[['Proprietary','Proprietario'],['Freeware','Freeware'],['Shareware','Shareware'],['Open source','Open source']], items:[
     {n:['Linux: anyone can read and improve the code','Linux: chiunque può leggere e migliorare il codice'],i:'globe',c:3,why:['Public source code = open source.','Codice pubblico = open source.']},
     {n:['A photo editor that costs €20 a month; code is secret','Un fotoritocco da 20 € al mese; codice segreto'],i:'lock',c:0,why:['You pay for a licence to use closed software.','Paghi una licenza per usare software chiuso.']},
     {n:['A game demo that stops after 10 levels until you buy it','Una demo che si blocca dopo 10 livelli finché non la compri'],i:'key',c:2,why:['Try first, pay later = shareware.','Prima provi, poi paghi = shareware.']},
     {n:['A free PDF reader whose code is secret','Un lettore PDF gratuito con codice segreto'],i:'heart',c:1,why:['Free but closed = freeware.','Gratis ma chiuso = freeware.']},
     {n:['LibreOffice','LibreOffice'],i:'globe',c:3,why:['LibreOffice is open source.','LibreOffice è open source.']},
     {n:['An office suite you buy with a licence key','Una suite per ufficio acquistata con codice di licenza'],i:'lock',c:0,why:['Paid and closed = proprietary.','A pagamento e chiuso = proprietario.']},
     {n:['A free music player; you can\'t see or change its code','Un lettore musicale gratuito; non puoi vederne il codice'],i:'heart',c:1,why:['Free to use, closed code = freeware.','Gratis da usare, codice chiuso = freeware.']},
     {n:['An antivirus with a 30-day free trial','Un antivirus con 30 giorni di prova gratuita'],i:'key',c:2,why:['Trial then pay = shareware.','Prova poi paga = shareware.']}]},
   {who:'d', vis:'demon', text:[`<p>Yarrr! I'm the Pirate Oni! I copy software without permission and spread viruses inside it!</p>`,`<p>Arrr! Sono l'Oni Pirata! Copio il software senza permesso e ci nascondo dentro i virus!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['Which is application software?','Quale di questi è software applicativo?'],a:[['A video editor','Un programma di montaggio video'],['An operating system','Un sistema operativo'],['A device driver','Un driver'],['Firmware','Il firmware']],why:['It helps the user do a task.','Aiuta l\'utente a svolgere un compito.']},
   {q:['What does a phone\'s accelerometer do?','A cosa serve l\'accelerometro del telefono?'],a:[['Measures movement and tilt (e.g. rotates the screen)','Misura movimento e inclinazione (es. ruota lo schermo)'],['Measures battery','Misura la batteria'],['Takes photos','Scatta foto'],['Connects to Wi-Fi','Si collega al Wi-Fi']],why:['It senses acceleration, including gravity.','Rileva l\'accelerazione, compresa la gravità.']},
   {q:['How does a GNSS receiver find your position?','Come trova la tua posizione un ricevitore GNSS?'],a:[['Using signals from at least four satellites','Usando i segnali di almeno quattro satelliti'],['By asking your friends','Chiedendo ai tuoi amici'],['With the accelerometer only','Solo con l\'accelerometro'],['From the phone\'s colour','Dal colore del telefono']],why:['GPS and Galileo are GNSS systems.','GPS e Galileo sono sistemi GNSS.']},
   {q:['Open source software means…','Software open source significa…'],a:[['The source code is public and can be studied and changed','Il codice sorgente è pubblico e si può studiare e modificare'],['It is always paid','È sempre a pagamento'],['It has no licence at all','Non ha nessuna licenza'],['It only runs online','Funziona solo online']],why:['Examples: Linux, Firefox, LibreOffice.','Esempi: Linux, Firefox, LibreOffice.']},
   {q:['Shareware is software that…','Lo shareware è un software che…'],a:[['You can try for free, then pay to keep using','Puoi provare gratis, poi paghi per continuare'],['Is always free forever','È sempre gratis per sempre'],['Has public code','Ha il codice pubblico'],['Cannot be installed','Non si può installare']],why:['Try before you buy.','Prima provi, poi compri.']},
   {q:['Copying paid software without permission is…','Copiare software a pagamento senza permesso è…'],a:[['Piracy, which is illegal','Pirateria, che è illegale'],['Open source','Open source'],['Always allowed for students','Sempre permesso agli studenti'],['A backup','Un backup']],why:['Software is protected by copyright.','Il software è protetto dal diritto d\'autore.']},
  ]},

{ id:'a5m1', arc:4, sec:'5.1–5.2', pages:'100–108', hue:230, horns:3, eyes:3,
  title:['The Net: Digital Communication','La rete: comunicazione digitale'], topic:['Communication, LAN, WAN, Internet, packets','Comunicazione, LAN, WAN, Internet, pacchetti'],
  demon:['Packet Thief','Ladro di Pacchetti'], tech:['Network Form · First Technique: Packet Storm','Stile della Rete · Prima Tecnica: Tempesta di Pacchetti'],
  scenes:[
   {who:'s', vis:'comm', text:[`<p>Every communication has a [[sender|emittente]], a [[receiver|ricevente]], a [[message|messaggio]] and a [[channel|canale]]. In digital communication the message is coded in bits, and both sides follow the same rules: a [[protocol|protocollo]].</p><p>Speed is measured in bits per second: Mbps, Gbps.</p>`,`<p>Ogni comunicazione ha un [[sender|emittente]], un [[receiver|ricevente]], un [[message|messaggio]] e un [[channel|canale]]. Nella comunicazione digitale il messaggio è codificato in bit, ed entrambi seguono le stesse regole: un [[protocol|protocollo]].</p><p>La velocità si misura in bit al secondo: Mbps, Gbps.</p>`]},
   {who:'s', vis:'networks', text:[`<p>A [[network|rete]] is a group of connected devices. A [[LAN|LAN]] covers one home, school or office; a [[WAN|WAN]] covers cities and countries. The [[Internet|Internet]] is a network of networks spanning the whole planet.</p><p>A [[router|router]] connects networks and chooses routes. Every device has an [[IP address|indirizzo IP]].</p>`,`<p>Una [[network|rete]] è un insieme di dispositivi collegati. Una [[LAN|LAN]] copre una casa, una scuola o un ufficio; una [[WAN|WAN]] copre città e Paesi. [[Internet|Internet]] è una rete di reti che avvolge il pianeta.</p><p>Il [[router|router]] collega le reti e sceglie i percorsi. Ogni dispositivo ha un [[IP address|indirizzo IP]].</p>`]},
   {who:'s', vis:'packets', text:[`<p>Big messages are split into small [[packets|pacchetti]]. Each packet carries the sender's and receiver's IP addresses and a number. Routers pass them along, sometimes by different roads, and at the end they are put back in order. The rules for this are the protocols [[TCP/IP|TCP/IP]].</p>`,`<p>I messaggi grandi vengono divisi in piccoli [[packets|pacchetti]]. Ogni pacchetto porta l'indirizzo IP di chi invia e di chi riceve e un numero. I router li inoltrano, a volte per strade diverse, e all'arrivo vengono rimessi in ordine. Le regole sono i protocolli [[TCP/IP|TCP/IP]].</p>`]},
   {type:'order', title:['How a message travels','Come viaggia un messaggio'], steps:[['You write a message and press Send','Scrivi un messaggio e premi Invia'],['It is split into numbered packets','Viene diviso in pacchetti numerati'],['Each packet gets the sender\'s and receiver\'s IP addresses','Ogni pacchetto riceve gli indirizzi IP di mittente e destinatario'],['Routers forward the packets across the Internet','I router inoltrano i pacchetti attraverso Internet'],['The packets arrive and are put back in order','I pacchetti arrivano e vengono rimessi in ordine'],['Your friend reads the message','La tua amica legge il messaggio']], hint:['Split first, then address, then travel, then rebuild.','Prima dividi, poi indirizza, poi viaggia, poi ricomponi.']},
   {who:'d', vis:'demon', text:[`<p>Snatch! I'm the Packet Thief. I'll grab your packets and your messages will never arrive!</p>`,`<p>Preso! Sono il Ladro di Pacchetti. Ruberò i tuoi pacchetti e i messaggi non arriveranno mai!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['What is a protocol?','Che cos\'è un protocollo?'],a:[['A set of shared rules for communicating','Un insieme di regole comuni per comunicare'],['A type of cable','Un tipo di cavo'],['A virus','Un virus'],['A web page','Una pagina web']],why:['Both sides must follow the same rules.','Entrambe le parti devono seguire le stesse regole.']},
   {q:['A LAN is…','Una LAN è…'],a:[['A local network, e.g. in a school','Una rete locale, ad es. in una scuola'],['The whole Internet','Tutta Internet'],['A satellite','Un satellite'],['A type of RAM','Un tipo di RAM']],why:['LAN = Local Area Network.','LAN = Local Area Network, rete locale.']},
   {q:['The Internet is…','Internet è…'],a:[['A worldwide network of networks','Una rete mondiale di reti'],['A single big computer','Un unico grande computer'],['A website','Un sito web'],['A browser','Un browser']],why:['It links millions of networks.','Collega milioni di reti.']},
   {q:['What does a router do?','Cosa fa un router?'],a:[['Connects networks and forwards packets along a route','Collega le reti e inoltra i pacchetti lungo un percorso'],['Prints documents','Stampa documenti'],['Stores files forever','Conserva file per sempre'],['Cools the network','Raffredda la rete']],why:['Routers direct internet traffic.','I router dirigono il traffico di Internet.']},
   {q:['Why are messages split into packets?','Perché i messaggi vengono divisi in pacchetti?'],a:[['Small packets travel efficiently and can take different routes','I pacchetti piccoli viaggiano meglio e possono seguire strade diverse'],['To make them secret','Per renderli segreti'],['Because cables are short','Perché i cavi sono corti'],['To change the language','Per cambiare lingua']],why:['They are rebuilt in order at the destination.','All\'arrivo vengono ricomposti in ordine.']},
   {q:['Internet speed is measured in…','La velocità di Internet si misura in…'],a:[['Bits per second (Mbps)','Bit al secondo (Mbps)'],['Kilograms','Chilogrammi'],['Pixels','Pixel'],['Degrees','Gradi']],why:['e.g. 100 Mbps = 100 million bits per second.','ad es. 100 Mbps = 100 milioni di bit al secondo.']},
  ]},
{ id:'a5m2', arc:4, sec:'5.3–5.4 + CLIL', pages:'109–113, 127', hue:60, horns:2, eyes:3,
  title:['Web Walker: Pages, Browsers & Search','Viandante del Web: pagine, browser e ricerche'], topic:['World Wide Web, URL, browser, searching well','World Wide Web, URL, browser, fare ricerche'],
  demon:['Rumour Kappa','Kappa delle Bufale'], tech:['Network Form · Second Technique: Hyperlink Leap','Stile della Rete · Seconda Tecnica: Balzo del Link'],
  scenes:[
   {who:'s', vis:'webnet', text:[`<p>The Internet and the Web are <b>not</b> the same thing. The [[World Wide Web|World Wide Web]] is one service that runs on the Internet: pages written in [[HTML|HTML]] and joined by [[hyperlinks|link]].</p><p>Tim Berners-Lee proposed it at CERN in 1989 (CLIL p. 127).</p>`,`<p>Internet e il Web <b>non</b> sono la stessa cosa. Il [[World Wide Web|World Wide Web]] è uno dei servizi che funzionano su Internet: pagine scritte in [[HTML|HTML]] e collegate da [[hyperlinks|link]].</p><p>Tim Berners-Lee lo propose al CERN nel 1989 (CLIL p. 127).</p>`]},
   {who:'s', vis:'url', text:[`<p>Every page has an address, the [[URL|URL]]. A [[browser|browser]] (Chrome, Firefox, Safari, Edge) asks the server for the page and displays it.</p><p>Look for <b>https</b> and the padlock: the connection is encrypted.</p>`,`<p>Ogni pagina ha un indirizzo, l'[[URL|URL]]. Il [[browser|browser]] (Chrome, Firefox, Safari, Edge) chiede la pagina al server e la mostra.</p><p>Cerca <b>https</b> e il lucchetto: la connessione è cifrata.</p>`]},
   {who:'s', vis:'search', text:[`<p>A [[search engine|motore di ricerca]] finds pages that match your [[keywords|parole chiave]]. The real skill is judging what you find: who wrote it, when, and can you confirm it elsewhere? Fake news spreads fast.</p>`,`<p>Un [[search engine|motore di ricerca]] trova le pagine che corrispondono alle tue [[keywords|parole chiave]]. La vera abilità è valutare ciò che trovi: chi l'ha scritto, quando, e lo puoi confermare altrove? Le bufale si diffondono in fretta.</p>`]},
   {type:'order', title:['Opening a web page','Aprire una pagina web'], steps:[['You type the URL and press Enter','Scrivi l\'URL e premi Invio'],['The browser looks up the server\'s IP address (DNS)','Il browser cerca l\'indirizzo IP del server (DNS)'],['The browser sends a request to the web server (HTTPS)','Il browser invia una richiesta al server web (HTTPS)'],['The server sends back the HTML page','Il server rimanda la pagina HTML'],['The browser draws the page on your screen','Il browser disegna la pagina sullo schermo']], hint:['The browser has to find the server before it can ask for the page.','Il browser deve trovare il server prima di chiedergli la pagina.']},
   {who:'d', vis:'demon', text:[`<p>Did you hear?! I'm the Rumour Kappa, and I spread fake news faster than anyone can check it!</p>`,`<p>Hai sentito?! Sono il Kappa delle Bufale, e diffondo notizie false più in fretta di quanto si possano verificare!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['Are the Internet and the Web the same thing?','Internet e il Web sono la stessa cosa?'],a:[['No: the Web is a service that runs on the Internet','No: il Web è un servizio che funziona su Internet'],['Yes, exactly the same','Sì, esattamente uguali'],['No: the Internet runs on the Web','No: Internet funziona sul Web'],['The Web is a type of cable','Il Web è un tipo di cavo']],why:['Email and online games also use the Internet without being the Web.','Anche e-mail e giochi online usano Internet senza essere il Web.']},
   {q:['Who invented the World Wide Web?','Chi ha inventato il World Wide Web?'],a:[['Tim Berners-Lee, at CERN','Tim Berners-Lee, al CERN'],['John von Neumann','John von Neumann'],['Gordon Moore','Gordon Moore'],['Nobody: it grew by itself','Nessuno: è nato da solo']],why:['He proposed it in 1989.','Lo propose nel 1989.']},
   {q:['In https://www.school-example.it/timetable.html, the domain is…','In https://www.school-example.it/timetable.html, il dominio è…'],a:[['www.school-example.it','www.school-example.it'],['https://','https://'],['/timetable.html','/timetable.html'],['.html','.html']],why:['The domain is the site\'s name.','Il dominio è il nome del sito.']},

  demon:['Phishing Hydra','Idra del Phishing'], tech:['Network Form · Third Technique: Shield of Netiquette','Stile della Rete · Terza Tecnica: Scudo della Netiquette'],
  scenes:[
   {who:'s', vis:'email', text:[`<p>An [[email address|indirizzo e-mail]] is <b>username @ domain</b>. Fields to know: To, Cc (copy), [[Bcc|Ccn]] (hidden copy), Subject and [[attachments|allegati]].</p><p>Write a clear subject and greet the person, especially when writing to teachers.</p>`,`<p>Un [[email address|indirizzo e-mail]] è <b>nome utente @ dominio</b>. I campi da conoscere: A, Cc (copia), [[Bcc|Ccn]] (copia nascosta), Oggetto e [[attachments|allegati]].</p><p>Scrivi un oggetto chiaro e saluta la persona, soprattutto quando scrivi ai professori.</p>`]},
   {who:'s', vis:'phishing', text:[`<p>[[Phishing|phishing]] is a fake message that pretends to come from a bank, shop or school to steal passwords or money. [[Spam|spam]] is unwanted mass email. Learn the warning signs.</p>`,`<p>Il [[Phishing|phishing]] è un messaggio falso che finge di arrivare da una banca, un negozio o la scuola per rubare password o soldi. Lo [[Spam|spam]] è posta indesiderata inviata in massa. Impara i segnali di pericolo.</p>`]},
   {who:'s', vis:'netiquette', text:[`<p>[[Social networks|social network]] connect people, but everything you post leaves a [[digital footprint|impronta digitale]]. Use privacy settings and think before you post.</p><p>[[Netiquette|netiquette]] is the set of good-manners rules for behaving online.</p>`,`<p>I [[Social networks|social network]] mettono in contatto le persone, ma tutto ciò che pubblichi lascia un'[[digital footprint|impronta digitale]]. Usa le impostazioni della privacy e pensa prima di pubblicare.</p><p>La [[Netiquette|netiquette]] è l'insieme delle regole di buona educazione per comportarsi online.</p>`]},
   {type:'sort', title:['Good netiquette or not?','Netiquette sì o no?'], cats:[['Good netiquette','Netiquette rispettata'],['Bad netiquette','Netiquette violata']], items:[
     {n:['Writing a whole message in CAPITALS','Scrivere un messaggio tutto in MAIUSCOLO'],i:'warn',c:1,why:['Capitals read as shouting.','Il maiuscolo sembra urlare.']},
     {n:['Asking a friend before posting a photo of them','Chiedere a un\'amica prima di pubblicare una sua foto'],i:'image',c:0,why:['Respect other people\'s privacy.','Rispetta la privacy degli altri.']},
     {n:['Forwarding a chain message to 50 people','Inoltrare una catena a 50 persone'],i:'mail',c:1,why:['That\'s spam.','È spam.']},
     {n:['Writing a clear subject in an email to a teacher','Scrivere un oggetto chiaro nell\'e-mail al prof'],i:'mail',c:0,why:['Clear and polite.','Chiaro ed educato.']},
     {n:['Leaving a mean comment under a classmate\'s video','Lasciare un commento cattivo sotto il video di un compagno'],i:'warn',c:1,why:['Offending people online is never OK, and can be cyberbullying.','Offendere online non va mai bene, e può essere cyberbullismo.']},
     {n:['Checking a news story before sharing it','Verificare una notizia prima di condividerla'],i:'search',c:0,why:['Stops fake news spreading.','Ferma la diffusione delle bufale.']},
     {n:['Using Bcc for an email to many people who don\'t know each other','Usare Ccn per un\'e-mail a tante persone che non si conoscono'],i:'mail',c:0,why:['It protects everyone\'s addresses.','Protegge gli indirizzi di tutti.']},
     {n:['Sharing a friend\'s password as a joke','Condividere per scherzo la password di un\'amica'],i:'key',c:1,why:['Never share passwords, yours or others\'.','Mai condividere password, tue o di altri.']}]},

   {q:['An email says "Your account will be closed! Send your password now!" It is probably…','Un\'e-mail dice "Il tuo account sarà chiuso! Invia subito la password!" Probabilmente è…'],a:[['Phishing','Phishing'],['A real warning','Un vero avviso'],['Netiquette','Netiquette'],['A newsletter','Una newsletter']],why:['Urgency + asking for passwords = classic phishing.','Urgenza + richiesta di password = phishing classico.']},

   {who:'s', vis:'boss', text:[`<p>{name}… this is it. Nullvoid, the Crash King, is the source of every Glitch Demon. He will attack with everything: algorithms, binary, hardware, software, networks.</p><p>But you've trained for all of it. Remember: a computer works because all its parts work as one team. Go.</p>`,`<p>{name}… ci siamo. Nullvoid, il Re del Crash, è l'origine di tutti i Demoni Glitch. Attaccherà con tutto: algoritmi, binario, hardware, software, reti.</p><p>Ma ti sei allenata per ognuno di questi. Ricorda: un computer funziona perché tutte le sue parti lavorano come una squadra. Vai.</p>`]},

{ id:'c6m1', arc:5, sec:'6.1–6.2', pages:'128–133', hue:350, horns:3, eyes:2,
  title:['Guarding the Gate: Threats & Passwords','A guardia del portale: minacce e password'], topic:['Information security, passwords, access control','Sicurezza delle informazioni, password, controllo degli accessi'],
  demon:['Password Leech','Sanguisuga delle Password'], tech:['Shield Form · First Technique: Passphrase Barrier','Stile dello Scudo · Prima Tecnica: Barriera della Passphrase'],
  scenes:[
   {who:'s', vis:'cia', text:[`<p>New arc, {name}: [[cybersecurity|sicurezza informatica]]. Protecting information means guarding three things: [[confidentiality|riservatezza]], [[integrity|integrità]] and [[availability|disponibilità]].</p><p>Threats can be accidents (a spilled drink, a lost phone), breakdowns, or attacks by criminals.</p>`,
     `<p>Nuovo arco, {name}: la [[cybersecurity|sicurezza informatica]]. Proteggere le informazioni significa difendere tre cose: [[confidentiality|riservatezza]], [[integrity|integrità]] e [[availability|disponibilità]].</p><p>Le minacce possono essere incidenti (una bibita rovesciata, un telefono perso), guasti, oppure attacchi di criminali.</p>`]},
   {who:'s', vis:'pwdtips', text:[`<p>[[Access control|controllo degli accessi]] decides who may enter. First you say who you are (username), then you prove it: [[authentication|autenticazione]]. Proof can be something you <b>know</b> (password), something you <b>have</b> (phone) or something you <b>are</b> (fingerprint).</p><p>Using two of them is [[two-factor authentication|autenticazione a due fattori]] (2FA).</p>`,
     `<p>Il [[Access control|controllo degli accessi]] decide chi può entrare. Prima dici chi sei (nome utente), poi lo dimostri: è l'[[authentication|autenticazione]]. La prova può essere qualcosa che <b>sai</b> (password), che <b>hai</b> (telefono) o che <b>sei</b> (impronta digitale).</p><p>Usarne due insieme è l'[[two-factor authentication|autenticazione a due fattori]] (2FA).</p>`]},
   {who:'s', vis:'pwdtips', text:[`<p>Now forge a password strong enough to stop the Password Leech. <b>Don't type a password you really use!</b> This is just practice.</p>`,`<p>Ora forgia una password abbastanza forte da fermare la Sanguisuga. <b>Non scrivere una password che usi davvero!</b> È solo un allenamento.</p>`]},
   {type:'pwd'},
   {who:'d', vis:'demon', text:[`<p>Slurrrp… I'm the Password Leech. I suck up weak passwords like "123456" and "qwerty"!</p>`,`<p>Slurrrp… Sono la Sanguisuga delle Password. Risucchio le password deboli come "123456" e "qwerty"!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['Which three things does information security protect?','Quali tre cose protegge la sicurezza delle informazioni?'],a:[['Confidentiality, integrity, availability','Riservatezza, integrità, disponibilità'],['Speed, colour, size','Velocità, colore, dimensione'],['Keyboard, mouse, screen','Tastiera, mouse, schermo'],['RAM, ROM, cache','RAM, ROM, cache']],why:['Often called the CIA triad.','Spesso chiamate "triade RID" (o CIA in inglese).']},
   {q:['Which password is strongest?','Quale password è la più forte?'],a:[['Ramen!Sotto-la-Luna7','Ramen!Sotto-la-Luna7'],['123456','123456'],['hana2011','hana2011'],['password','password']],why:['Long, mixed, and not personal.','Lunga, varia e non personale.']},
   {q:['Two-factor authentication means…','Autenticazione a due fattori significa…'],a:[['Using two different proofs, e.g. password + code on your phone','Usare due prove diverse, es. password + codice sul telefono'],['Typing the password twice','Scrivere la password due volte'],['Having two accounts','Avere due account'],['Using two keyboards','Usare due tastiere']],why:['Even if someone steals the password, they still need your phone.','Anche se qualcuno ruba la password, gli serve ancora il tuo telefono.']},
   {q:['A fingerprint used to unlock a phone is something you…','L\'impronta digitale per sbloccare il telefono è qualcosa che…'],a:[['Are','Sei'],['Know','Sai'],['Have','Hai'],['Forget','Dimentichi']],why:['Biometrics = something you are.','La biometria = qualcosa che sei.']},
   {q:['Why shouldn\'t you use the same password everywhere?','Perché non usare la stessa password ovunque?'],a:[['If one site is hacked, all your accounts are at risk','Se un sito viene violato, tutti i tuoi account sono a rischio'],['It is too long','È troppo lunga'],['Computers forget it','I computer la dimenticano'],['It is illegal','È illegale']],why:['Attackers try leaked passwords on other sites.','Gli attaccanti provano le password rubate su altri siti.']},
   {q:['Which of these is a threat to data availability?','Quale di questi minaccia la disponibilità dei dati?'],a:[['A hard disk breaks and there is no backup','Si rompe il disco e non c\'è un backup'],['A long password','Una password lunga'],['An antivirus update','Un aggiornamento dell\'antivirus'],['A locked screen','Uno schermo bloccato']],why:['The data exists but you can\'t reach it.','I dati esistono ma non li puoi raggiungere.']},
  ]},
{ id:'c6m2', arc:5, sec:'6.3–6.4 + CLIL', pages:'134–139, 151', hue:120, horns:4, eyes:3,
  title:['The Malware Horde','L\'orda dei malware'], topic:['Malware, antivirus, firewalls and network security','Malware, antivirus, firewall e sicurezza delle reti'],
  demon:['Ransom Oni','Oni del Riscatto'], tech:['Shield Form · Second Technique: Firewall Wall','Stile dello Scudo · Seconda Tecnica: Muro Tagliafuoco'],
  scenes:[
   {who:'s', vis:'malware', text:[`<p>[[Malware|malware]] (malicious software) is any program written to cause harm. Each type attacks differently.</p><p>The CLIL page (p. 151) tells the story of the 2017 ransomware attack that hit computers in 99 countries in a single day.</p>`,`<p>Il [[Malware|malware]] (software malevolo) è qualsiasi programma scritto per fare danni. Ogni tipo attacca in modo diverso.</p><p>La pagina CLIL (p. 151) racconta l'attacco ransomware del 2017 che colpì computer in 99 Paesi in un solo giorno.</p>`]},
   {who:'s', vis:'netsec', text:[`<p>Defences: an [[antivirus|antivirus]] scans files for known malware; a [[firewall|firewall]] filters network traffic; protected Wi-Fi uses [[encryption|cifratura]] (WPA2/WPA3); and [[updates|aggiornamenti]] close security holes.</p><p>The best defence is you: don't open strange attachments or install programs from unknown sites.</p>`,`<p>Le difese: l'[[antivirus|antivirus]] cerca nei file i malware conosciuti; il [[firewall|firewall]] filtra il traffico di rete; il Wi-Fi protetto usa la [[encryption|cifratura]] (WPA2/WPA3); e gli [[updates|aggiornamenti]] chiudono le falle di sicurezza.</p><p>La difesa migliore sei tu: non aprire allegati strani e non installare programmi da siti sconosciuti.</p>`]},
   {type:'sort', title:['Name the malware','Riconosci il malware'], cats:[['Virus','Virus'],['Worm','Worm'],['Trojan','Trojan'],['Ransomware','Ransomware']], items:[
     {n:['Spreads when you open an infected file','Si diffonde quando apri un file infetto'],i:'bug',c:0,why:['Viruses attach to files.','I virus si attaccano ai file.']},
     {n:['Copies itself from computer to computer over the network on its own','Si copia da solo da un computer all\'altro attraverso la rete'],i:'share',c:1,why:['Worms spread by themselves.','I worm si diffondono da soli.']},
     {n:['A "free game" that secretly installs malware','Un "gioco gratis" che installa di nascosto un malware'],i:'gamepad',c:2,why:['Hidden inside something that looks useful.','Nascosto dentro qualcosa che sembra utile.']},
     {n:['"Your files are encrypted. Pay to get them back."','"I tuoi file sono cifrati. Paga per riaverli."'],i:'lock',c:3,why:['It holds your files for ransom.','Tiene in ostaggio i tuoi file.']},
     {n:['Infects a document and spreads when it is shared and opened','Infetta un documento e si diffonde quando viene condiviso e aperto'],i:'file',c:0,why:['Needs a host file: virus.','Ha bisogno di un file ospite: virus.']},
     {n:['A fake "video player update" that opens a back door','Un falso "aggiornamento del lettore video" che apre una porta nascosta'],i:'update',c:2,why:['Disguised as an update: Trojan.','Travestito da aggiornamento: trojan.']},
     {n:['Locks a hospital\'s computers and demands bitcoin','Blocca i computer di un ospedale e chiede bitcoin'],i:'warn',c:3,why:['Classic ransomware.','Ransomware classico.']},
     {n:['Crawls through unpatched computers on a network by itself','Si sposta da solo tra i computer non aggiornati di una rete'],i:'globe',c:1,why:['Self-spreading: worm.','Si diffonde da solo: worm.']}]},
   {who:'d', vis:'demon', text:[`<p>Pay up! I'm the Ransom Oni. I've locked every file in the academy. Want them back? That'll cost you!</p>`,`<p>Paga! Sono l'Oni del Riscatto. Ho bloccato tutti i file dell'accademia. Li rivuoi? Ti costerà caro!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['What is malware?','Che cos\'è un malware?'],a:[['Software written to cause harm','Software scritto per fare danni'],['A broken mouse','Un mouse rotto'],['A slow internet connection','Una connessione lenta'],['A type of RAM','Un tipo di RAM']],why:['Malware = malicious software.','Malware = software malevolo.']},
   {q:['What does ransomware do?','Cosa fa un ransomware?'],a:[['Encrypts your files and demands money','Cifra i tuoi file e chiede un riscatto'],['Shows ads','Mostra pubblicità'],['Speeds up the PC','Velocizza il PC'],['Backs up your files','Fa il backup dei file']],why:['Backups are the best protection against it.','Il backup è la miglior protezione contro di esso.']},
   {q:['A Trojan horse is…','Un cavallo di Troia è…'],a:[['Malware disguised as a useful program','Un malware travestito da programma utile'],['A strong password','Una password forte'],['A firewall','Un firewall'],['A type of cable','Un tipo di cavo']],why:['Like the wooden horse in the Greek story.','Come il cavallo di legno del mito greco.']},
   {q:['What does a firewall do?','Cosa fa un firewall?'],a:[['Filters which network traffic can enter or leave','Filtra il traffico di rete in entrata e in uscita'],['Cools the CPU','Raffredda la CPU'],['Prints files','Stampa i file'],['Makes passwords','Crea password']],why:['It acts like a guard at the network\'s gate.','Fa da guardia all\'ingresso della rete.']},
   {q:['Why should you install updates?','Perché installare gli aggiornamenti?'],a:[['They fix security holes','Chiudono le falle di sicurezza'],['They make the screen bigger','Ingrandiscono lo schermo'],['They delete viruses\' names','Cancellano i nomi dei virus'],['They are optional decorations','Sono solo decorazioni']],why:['Many attacks use holes that were already fixed.','Molti attacchi sfruttano falle già corrette.']},
   {q:['Which Wi-Fi setting is safest at home?','Quale impostazione Wi-Fi è più sicura a casa?'],a:[['WPA2/WPA3 with a strong password','WPA2/WPA3 con una password forte'],['No password','Nessuna password'],['The router\'s default password','La password predefinita del router'],['Your name as password','Il tuo nome come password']],why:['Encryption keeps neighbours and attackers out.','La cifratura tiene fuori vicini e attaccanti.']},
  ]},
{ id:'c6m3', arc:5, sec:'6.5–6.6 + VPN', pages:'140–152', hue:200, horns:2, eyes:4,
  title:['Safe Paths: Browsing, Backup & VPN','Sentieri sicuri: navigazione, backup e VPN'], topic:['Safe browsing, backup, secure deletion, VPN, video surveillance debate','Navigare sicuri, backup, cancellazione sicura, VPN, videosorveglianza'],
  demon:['Data Devourer','Divoratore di Dati'], tech:['Shield Form · Third Technique: Triple Backup Seal','Stile dello Scudo · Terza Tecnica: Sigillo del Triplo Backup'],
  scenes:[
   {who:'s', vis:'safeweb', text:[`<p>Browsing safely: look for [[HTTPS|HTTPS]], be careful with [[cookies|cookie]], avoid logging in on open public Wi-Fi, and download only from official sources.</p>`,`<p>Navigare sicuri: cerca l'[[HTTPS|HTTPS]], fai attenzione ai [[cookies|cookie]], evita di accedere agli account sul Wi-Fi pubblico aperto e scarica solo da fonti ufficiali.</p>`]},
   {who:'s', vis:'backup', text:[`<p>A [[backup|backup]] is a copy of your data kept somewhere else. Hunters follow the 3-2-1 rule.</p><p>And when you throw away an old phone or disk: "delete" only hides files! [[Secure deletion|cancellazione sicura]] overwrites the data or does a factory reset with encryption so nobody can recover it.</p>`,`<p>Il [[backup|backup]] è una copia dei dati conservata altrove. Le cacciatrici seguono la regola 3-2-1.</p><p>E quando butti un vecchio telefono o disco: "elimina" nasconde soltanto i file! La [[Secure deletion|cancellazione sicura]] sovrascrive i dati o ripristina il dispositivo con la cifratura, così nessuno può recuperarli.</p>`]},
   {who:'s', vis:'vpn', text:[`<p>A [[VPN|VPN]] (Virtual Private Network) creates an encrypted tunnel between your device and a VPN server. Useful on public Wi-Fi.</p><p>Your book's real-world task is a debate on video surveillance: more safety, but less privacy. Think about both sides!</p>`,`<p>Una [[VPN|VPN]] (rete privata virtuale) crea un tunnel cifrato tra il tuo dispositivo e un server VPN. Utile sul Wi-Fi pubblico.</p><p>Il compito di realtà del libro è un dibattito sulla videosorveglianza: più sicurezza, ma meno privacy. Pensa a entrambi i lati!</p>`]},
   {type:'sort', title:['Safe or risky?','Sicuro o rischioso?'], cats:[['Safe','Sicuro'],['Risky','Rischioso']], items:[
     {n:['Logging into your bank on café Wi-Fi without a VPN','Accedere alla banca dal Wi-Fi del bar senza VPN'],i:'wifi',c:1,why:['Open networks can be spied on.','Le reti aperte possono essere spiate.']},
     {n:['Keeping a copy of your photos on an external disk and in the cloud','Tenere le foto su un disco esterno e nel cloud'],i:'hdd',c:0,why:['That\'s the 3-2-1 rule.','È la regola 3-2-1.']},
     {n:['Downloading a game from a random site promising it free','Scaricare un gioco da un sito qualsiasi che lo promette gratis'],i:'warn',c:1,why:['A common way to get Trojans.','Un modo comune per prendersi un trojan.']},
     {n:['Typing a password only on a page with https and the padlock','Inserire la password solo su pagine con https e lucchetto'],i:'lock',c:0,why:['The connection is encrypted.','La connessione è cifrata.']},
     {n:['Selling an old phone after just deleting the photos','Vendere un vecchio telefono dopo aver solo cancellato le foto'],i:'touch',c:1,why:['Deleted files can often be recovered. Do a full secure reset.','I file cancellati spesso si recuperano. Fai un ripristino completo e sicuro.']},
     {n:['Rejecting unnecessary cookies','Rifiutare i cookie non necessari'],i:'eye',c:0,why:['Less tracking of what you do.','Meno tracciamento di ciò che fai.']},
     {n:['Clicking a pop-up saying "Your PC is infected! Click here!"','Cliccare un pop-up che dice "Il tuo PC è infetto! Clicca qui!"'],i:'warn',c:1,why:['Fake alerts are a classic trap.','I falsi avvisi sono una trappola classica.']},
     {n:['Turning on automatic updates','Attivare gli aggiornamenti automatici'],i:'update',c:0,why:['Security holes get fixed quickly.','Le falle vengono chiuse in fretta.']}]},
   {who:'d', vis:'demon', text:[`<p>Crunch crunch… I'm the Data Devourer. No backup? Then your files are my dinner!</p>`,`<p>Gnam gnam… Sono il Divoratore di Dati. Niente backup? Allora i tuoi file sono la mia cena!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['What is the 3-2-1 backup rule?','Che cos\'è la regola del backup 3-2-1?'],a:[['3 copies, on 2 different media, 1 kept elsewhere','3 copie, su 2 supporti diversi, 1 conservata altrove'],['Back up 3 times a day','Fare il backup 3 volte al giorno'],['3 passwords for 2 accounts','3 password per 2 account'],['Delete 3 files, keep 2','Cancellare 3 file e tenerne 2']],why:['If one copy is lost, the others survive.','Se una copia si perde, le altre sopravvivono.']},
   {q:['What does a VPN do?','Cosa fa una VPN?'],a:[['Creates an encrypted tunnel for your traffic','Crea un tunnel cifrato per il tuo traffico'],['Makes the PC faster','Rende il PC più veloce'],['Deletes viruses','Cancella i virus'],['Prints securely','Stampa in modo sicuro']],why:['VPN = Virtual Private Network.','VPN = rete privata virtuale.']},
   {q:['When you "delete" a file normally…','Quando "elimini" un file normalmente…'],a:[['It can often still be recovered','Spesso si può ancora recuperare'],['It is destroyed forever','È distrutto per sempre'],['It is sent to the police','Viene inviato alla polizia'],['It becomes a virus','Diventa un virus']],why:['Use secure deletion before giving a device away.','Usa la cancellazione sicura prima di dare via un dispositivo.']},
   {q:['What are cookies?','Che cosa sono i cookie?'],a:[['Small files websites save to remember you','Piccoli file che i siti salvano per ricordarti'],['Viruses','Virus'],['Passwords','Password'],['Backups','Backup']],why:['Some are useful; others track you for advertising.','Alcuni sono utili, altri ti tracciano per la pubblicità.']},
   {q:['Why is public Wi-Fi risky?','Perché il Wi-Fi pubblico è rischioso?'],a:[['Others on the network may spy on unencrypted traffic','Altri sulla rete possono spiare il traffico non cifrato'],['It is too fast','È troppo veloce'],['It breaks phones','Rompe i telefoni'],['It is always paid','È sempre a pagamento']],why:['Use HTTPS or a VPN.','Usa HTTPS o una VPN.']},
   {q:['Which is a sign of a safe login page?','Quale è un segno di una pagina di accesso sicura?'],a:[['https:// and a padlock, on the correct address','https:// e il lucchetto, sull\'indirizzo corretto'],['Lots of pop-ups','Tanti pop-up'],['Spelling mistakes','Errori di ortografia'],['A countdown timer','Un conto alla rovescia']],why:['Always check the domain too!','Controlla sempre anche il dominio!']},
  ]},
