<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} img{max-width:100%} body{margin:0}</style>
<title>Circuit Hunter Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* Layout: single-column game shell — HUD band, stage card (animated diagram over a dialogue bubble), battle arena */
:root{
  --ink:#0e0f22; --panel:#171935; --panel2:#20234a; --line:#363a74; --text:#eeecf8; --muted:#a9a8cc;
  --ember:#ff6a3d; --data:#45d8ff; --sakura:#ff8fc0; --good:#4be39a; --bad:#ff4d6d; --gold:#ffd166;
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Segoe UI",system-ui,sans-serif;
  --mono:"DotGothic16",ui-monospace,"Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px;
  background-image:radial-gradient(circle at 85% -5%,rgba(255,106,61,.16),transparent 42%),radial-gradient(circle at 0% 35%,rgba(69,216,255,.09),transparent 40%);
  background-attachment:fixed;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2;letter-spacing:.01em}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--data)}
.muted{color:var(--muted)}
.term{font-weight:800;color:var(--data)}
.it{display:inline-block;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--sakura);border:1px solid rgba(255,143,192,.45);border-radius:6px;padding:0 6px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.it::before{content:attr(data-l) " ";opacity:.6}
:focus-visible{outline:3px solid var(--data);outline-offset:2px}

/* buttons */
.btn{font:700 15px var(--body);border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--ember);color:#1b0c06;transition:transform .12s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--data)}
.btn.cyan{background:var(--data);color:#05202a}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.38;cursor:not-allowed}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.brand{font-family:var(--display);font-size:17px;letter-spacing:.03em;cursor:pointer;background:none;border:0;color:var(--text);padding:0}
.brand b{color:var(--ember);font-weight:400}
.hud-r{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.who-hud{display:flex;flex-direction:column;gap:3px;min-width:150px}
.who-hud .nm{font-weight:800;font-size:14px}
.rank{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.05em}
.xpbar{width:150px;height:7px;border-radius:99px;background:#2a2d5c;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--sakura));transition:width .6s}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}

/* map */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:center}
.hero > *{min-width:0}
.hero h1{font-size:clamp(30px,6vw,54px)}
.hero h1 span{color:var(--ember)}
.hero .lede{max-width:56ch;color:#d6d4ea;margin-top:10px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}
.mcard{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;gap:6px;font:inherit;transition:transform .15s,border-color .15s}
.mcard:hover:not(:disabled){border-color:var(--ember);transform:translateY(-2px)}
.mcard .num{font-family:var(--mono);color:var(--muted);font-size:13px}
.mcard h3{font-size:18px;padding-right:58px}
.mcard .topic{color:var(--muted);font-size:14px}
.mcard .dm{width:56px;height:56px;position:absolute;right:10px;top:10px}
.mcard:disabled{opacity:.45;cursor:not-allowed}
.mcard.cleared{border-color:rgba(75,227,154,.55)}
.badge{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:99px;align-self:flex-start}
.badge.ok{background:rgba(75,227,154,.15);color:var(--good)}
.badge.lock{background:#2a2d5c;color:var(--muted)}
.badge.go{background:rgba(255,106,61,.18);color:var(--ember)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.reg{display:flex;flex-direction:column;gap:12px;max-width:520px}
.reg input{font:600 17px var(--body);padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);width:100%}

/* mission */
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.mhead h2{font-size:clamp(22px,4vw,30px)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:#2a2d5c}
.dots i.done{background:var(--ember)}
.dots i.now{background:var(--data)}
.visual{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
.dia{width:100%;height:auto;display:block}
.dia text{font-family:var(--mono);fill:var(--text);font-size:14px}
.dia .sm{font-size:11px;fill:var(--muted)}
.dia .lbl{font-size:13px;letter-spacing:.1em;fill:var(--data)}
.dialog{display:flex;gap:14px;align-items:flex-start;animation:rise .35s ease-out}
.avatar{flex:0 0 60px;width:60px;height:60px}
.bubble{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.bubble .who{font-family:var(--display);font-size:15px;color:var(--ember);margin-bottom:6px}
.bubble.you .who{color:var(--data)}
.bubble.demon .who{color:var(--bad)}
.bubble p{margin:0 0 .65em;max-width:70ch}
.bubble p:last-child{margin-bottom:0}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.narr{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:76px}
.narr b.step{font-family:var(--display);font-weight:400;color:var(--gold);margin-right:6px}
.stepbar{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

/* diagram parts */
.part rect{fill:#262a5e;stroke:#454a8e;stroke-width:2;transition:fill .3s,stroke .3s}
.part.on rect.box{fill:#3b2440;stroke:var(--ember);stroke-width:3}
.zone{cursor:pointer}
.zone:hover rect,.zone:hover circle,.zone:focus rect,.zone:focus circle,.zone.on rect,.zone.on circle{stroke:var(--gold)!important;stroke-width:3}
.zone:focus{outline:none}
.flow{stroke-dasharray:6 8;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.spin{animation:spin 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.swing{animation:swing 2.4s ease-in-out infinite;transform-origin:520px 40px}
@keyframes swing{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.pulse{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.4}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* html visuals */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.twocol > *{min-width:0}
@media (max-width:600px){.twocol{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{font-size:18px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 8px;font-size:14px}
.chip .ico{width:18px;height:18px;color:var(--data)}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.lvl{width:var(--w);min-width:min(180px,100%);max-width:100%;text-align:center;padding:9px 10px;border-radius:8px;font-weight:800;color:#120b18;background:var(--c)}
.lvl small{display:block;font-weight:400;font-size:12px;opacity:.85}
.pyr-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;gap:10px;flex-wrap:wrap}
.pc{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.pc > *{min-width:0}
@media (max-width:600px){.pc{grid-template-columns:1fr}}
.pc-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pc-h{font-weight:800}
.pc-h small{display:block;font-family:var(--mono);font-weight:400;color:var(--muted)}
.files{display:flex;flex-direction:column;gap:6px;transition:opacity .6s,filter .6s;min-height:110px}
.file{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px}
.files.gone{opacity:.08;filter:blur(3px)}
.pc-mid{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.power{font-family:var(--mono);padding:6px 12px;border-radius:8px;background:rgba(75,227,154,.15);color:var(--good)}
.power.off{background:rgba(255,77,109,.15);color:var(--bad)}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.rung > *{min-width:0}
.rung b{font-family:var(--display);font-weight:400;color:var(--gold)}
.rung span{font-size:14px}
.cores{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.core{aspect-ratio:1;max-width:100%;border-radius:6px;background:#2a2d5c;animation:corefire 1.6s ease-in-out infinite}
@keyframes corefire{0%,100%{background:#2a2d5c}50%{background:var(--ember)}}
.core.g{animation-name:gfire;border-radius:3px}
@keyframes gfire{0%,100%{background:#2a2d5c}50%{background:var(--data)}}
.stack{display:flex;flex-direction:column;gap:0;align-items:stretch}
.layer{position:relative;text-align:center;padding:12px;border-radius:10px;font-weight:800;color:#120b18}
.layer small{display:block;font-weight:400;font-size:13px}
.arrowdown{height:22px;display:flex;justify-content:center}
.arrowdown i{width:3px;height:100%;background:repeating-linear-gradient(to bottom,var(--data) 0 5px,transparent 5px 9px);background-size:3px 18px;animation:down .6s linear infinite}
@keyframes down{to{background-position:0 18px}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.mini .ico{width:28px;height:28px;color:var(--data)}
.mini b{font-size:15px}
.mini span{font-size:14px;color:#d1d0e6}
.ioflow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.ioflow > *{min-width:0}
.iocol{display:flex;flex-direction:column;gap:8px}
.iobox{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border-radius:12px;border:2px solid var(--ember);background:var(--panel)}
.iobox .ico{width:46px;height:46px;color:var(--ember)}
@media (max-width:560px){.ioflow{grid-template-columns:1fr}}

/* games */
.game{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.gtitle{font-family:var(--display);font-size:20px}
.count{font-family:var(--mono);color:var(--muted)}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 26px;background:var(--panel);border-radius:14px;border:1px solid var(--line);min-width:min(240px,100%);animation:rise .3s}
.item .ico{width:58px;height:58px;color:var(--data)}
.iname{font-weight:800;font-size:19px}
.cats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn.wrong{background:var(--bad);color:#200}
.btn.right{background:var(--good);color:#032}
.fb{min-height:28px;max-width:62ch}
.fb.ok{color:var(--good)}
.fb.no{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ord{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;text-align:left}
.ord > *{min-width:0}
@media (max-width:600px){.ord{grid-template-columns:1fr}}
.ord ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.ord li{background:rgba(75,227,154,.12);border:1px solid rgba(75,227,154,.5);border-radius:8px;padding:6px 10px}
.pool{display:flex;flex-direction:column;gap:8px}
.pool .btn{text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.pool .btn:hover{border-color:var(--data)}
.board{width:100%;display:grid;gap:10px;grid-template-columns:repeat(4,1fr);grid-template-areas:"cpu cpu ram psu" "cool cool ram psu" "gpu gpu ssd ssd";background:#0e3a3b;background-image:linear-gradient(90deg,rgba(80,200,180,.09) 1px,transparent 1px),linear-gradient(rgba(80,200,180,.09) 1px,transparent 1px);background-size:18px 18px;padding:14px;border-radius:14px;border:2px solid #1f6261}
.slot{min-height:76px;border:2px dashed #4a9f95;border-radius:10px;background:rgba(0,0,0,.25);color:#cfeee9;font:600 14px var(--body);cursor:pointer;padding:8px;min-width:0}
.slot:hover{border-color:var(--gold)}
.slot.filled{border-style:solid;border-color:var(--good);background:rgba(75,227,154,.2);color:#fff;cursor:default}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pbtn{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:700 14px var(--body);cursor:pointer}
.pbtn .ico{width:20px;height:20px;color:var(--data)}
.pbtn.sel{border-color:var(--data);box-shadow:0 0 0 2px var(--data)}

/* battle */
.arena{display:grid;grid-template-columns:1fr 1.3fr;gap:14px;align-items:center;padding:18px;border-radius:16px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 70% 110%,rgba(255,77,109,.22),transparent 60%),repeating-conic-gradient(from 0deg at 70% 50%,rgba(255,255,255,.035) 0 4deg,transparent 4deg 12deg),var(--panel)}
.arena > *{min-width:0}
.hunter{display:flex;flex-direction:column;gap:8px}
.hunter .hn{font-family:var(--display);font-size:18px}
.hearts{display:flex;gap:6px}
.hearts svg{width:24px;height:24px}
.foe{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.foe .demon{width:min(210px,100%);height:auto}
.foe .fname{font-family:var(--display);color:var(--bad);text-align:center}
.hp{width:100%;max-width:260px;height:12px;background:#2a2d5c;border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--ember));transition:width .5s}
.hp-l{font-family:var(--mono);font-size:12px;color:var(--muted)}
.foe.hit .demon{animation:hit .5s}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(12px);filter:brightness(2.4)}45%{transform:translateX(-8px)}70%{transform:translateX(4px)}}
.slash{position:absolute;left:-5%;top:42%;width:110%;height:7px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff,var(--data),transparent);transform:rotate(-24deg) scaleX(0);opacity:0;pointer-events:none}
.foe.hit .slash{animation:slash .45s ease-out}
@keyframes slash{0%{transform:rotate(-24deg) scaleX(0);opacity:1}55%{transform:rotate(-24deg) scaleX(1);opacity:1}100%{transform:rotate(-24deg) scaleX(1);opacity:0}}
.shout{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--display);color:var(--gold);font-size:clamp(15px,3vw,23px);text-align:center;text-shadow:0 2px 0 #000,0 0 16px rgba(255,106,61,.8);pointer-events:none;opacity:0;width:92%;z-index:2}
.shout.show{animation:shout 1.6s ease-out}
@keyframes shout{0%{opacity:0;transform:translateX(-50%) scale(.6)}15%{opacity:1;transform:translateX(-50%) scale(1.08)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0}}
.arena.ouch{animation:ouch .5s}
@keyframes ouch{0%,100%{box-shadow:none}30%{box-shadow:inset 0 0 0 4px var(--bad),inset 0 0 60px rgba(255,77,109,.5)}}
@media (max-width:520px){.arena{grid-template-columns:1fr 1.1fr;padding:12px}}
.qcard{display:flex;flex-direction:column;gap:12px}
.qtext{font-size:18px;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:600 15px var(--body);cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--data)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:rgba(75,227,154,.16)}
.opt.wrong{border-color:var(--bad);background:rgba(255,77,109,.16)}
.why{border:1px solid rgba(69,216,255,.4);background:rgba(69,216,255,.07);border-radius:12px;padding:10px 14px}
.why b{color:var(--data)}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result h2{font-size:clamp(26px,5vw,40px)}
.result .tech{font-family:var(--display);color:var(--gold);font-size:20px}
.cert{border:3px double var(--gold);border-radius:16px;padding:22px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(255,209,102,.15),transparent 60%),var(--panel);display:flex;flex-direction:column;gap:8px;align-items:center}
.cert .nm{font-family:var(--display);font-size:clamp(26px,6vw,44px);color:var(--gold)}

/* codex */
.codex-search{font:600 16px var(--body);padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);width:100%;max-width:420px}
.cx-group{display:flex;flex-direction:column;gap:8px}
.cx-group h3{font-size:17px;color:var(--ember)}
.cx{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cx-e{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.cx-e b{color:var(--data)}
.cx-e p{font-size:14px;color:#d1d0e6;margin-top:4px}
.cx-e.locked{opacity:.45}
.techlist{display:flex;flex-direction:column;gap:6px}
.techlist div{font-family:var(--mono);font-size:14px;color:var(--gold)}


/* v2 additions */
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);font:700 13px var(--mono);padding:6px 11px;cursor:pointer}
.lang button.on{background:var(--data);color:#05202a}
.arc{display:flex;flex-direction:column;gap:10px}
.arc-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.arc-h .n{font-family:var(--display);color:var(--ember);font-size:24px}
.arc-h h2{font-size:20px}
.arc-h .pg{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mcard .sec{font-family:var(--mono);font-size:12px;color:var(--sakura)}
.robo{display:grid;grid-template-columns:auto 1fr;gap:16px;width:100%;text-align:left;align-items:start}

function demonSVG(h, horns=2, eyes=2, cls='demon'){
  const body=`hsl(${h} 62% 42%)`, dark=`hsl(${h} 60% 18%)`, glow=`hsl(${(h+170)%360} 100% 72%)`;
  let hs='';
  for(let i=0;i<horns;i++){const x = horns===1?100: 62+i*(76/(horns-1)); const tip = 14+((i%2)*12)+(Math.abs(x-100)<12?-6:0);
    hs+=`<polygon points="${x-11},66 ${x+(x<100?-6:6)},${tip} ${x+11},66" fill="${dark}" stroke="${glow}" stroke-width="1.5"/>`;}
  let es='';
  for(let i=0;i<eyes;i++){const x = eyes===1?100: 72+i*(56/(eyes-1)); const y = eyes>2 && i%2 ? 92 : 102;
    es+=`<ellipse cx="${x}" cy="${y}" rx="11" ry="7" fill="${glow}"/><rect x="${x-1.6}" y="${y-6}" width="3.2" height="12" fill="${dark}"/>`;}
  let gl='';
  for(let i=0;i<6;i++){const x=30+((i*53)%140), y=40+((i*37)%130);
    gl+=`<rect class="blink" style="animation-delay:${i*.23}s" x="${x}" y="${y}" width="${6+(i%3)*4}" height="5" fill="${glow}" opacity=".7"/>`;}
  return `<svg viewBox="0 0 200 200" class="${cls}" aria-hidden="true"><g class="float">${hs}
    <path d="M40 122 Q38 56 100 50 Q162 56 160 122 Q160 176 132 180 L121 166 L110 182 L100 166 L90 182 L79 166 L68 180 Q40 176 40 122Z" fill="${body}" stroke="${dark}" stroke-width="5"/>
    <path d="M58 92 Q100 70 142 92" fill="none" stroke="${dark}" stroke-width="4" opacity=".6"/>
    ${es}
    <path d="M70 142 L80 133 L90 144 L100 133 L110 144 L120 133 L130 142" fill="none" stroke="${glow}" stroke-width="3.5" stroke-linejoin="round"/>
    ${gl}</g></svg>`;
}

{ id:'a2m1', arc:1, sec:'2.1–2.2', pages:'19–28', hue:50, horns:2, eyes:2,

  demon:['Bit Flipper','Ribalta-Bit'], tech:['Binary Form · First Technique: Eight-Bit Barrage','Stile Binario · Prima Tecnica: Raffica a Otto Bit'],
  scenes:[
   {who:'s', vis:'switches', text:[`<p>Inside a computer there are billions of tiny switches called transistors. Each one is either <b>on</b> or <b>off</b>: 1 or 0.</p><p>One 0 or 1 is a [[bit|bit]] (binary digit). Eight bits make a [[byte|byte]].</p><p>With 1 bit you get 2 combinations, with 2 bits 4, with 8 bits 2⁸ = <b>256</b>.</p>`,
     `<p>Dentro un computer ci sono miliardi di minuscoli interruttori chiamati transistor. Ognuno è <b>acceso</b> o <b>spento</b>: 1 oppure 0.</p><p>Un singolo 0 o 1 è un [[bit|bit]] (binary digit, cifra binaria). Otto bit formano un [[byte|byte]].</p><p>Con 1 bit hai 2 combinazioni, con 2 bit 4, con 8 bit 2⁸ = <b>256</b>.</p>`]},
   {who:'s', vis:'places', text:[`<p>Our everyday numbers use base 10: units, tens, hundreds. The [[binary system|sistema binario]] uses base 2, so each place is worth double the one on its right: 1, 2, 4, 8, 16, 32, 64, 128.</p><p>To read a binary number, add up the place values where there is a 1.</p>`,
     `<p>I numeri di tutti i giorni sono in base 10: unità, decine, centinaia. Il [[binary system|sistema binario]] è in base 2: ogni posizione vale il doppio di quella alla sua destra: 1, 2, 4, 8, 16, 32, 64, 128.</p><p>Per leggere un numero binario, somma i valori delle posizioni dove c'è un 1.</p>`]},
   {who:'s', vis:'div2', text:[`<p>To turn a decimal number into binary, keep dividing by 2 and write down the remainders. Then read them from the <b>bottom up</b>.</p><p>13 in binary is 1101.</p>`,`<p>Per trasformare un numero decimale in binario, dividi per 2 più volte e annota i resti. Poi leggili <b>dal basso verso l'alto</b>.</p><p>13 in binario è 1101.</p>`]},
   {who:'s', vis:'units', text:[`<p>Bytes are grouped into bigger units, like hunter ranks: [[kilobyte|kilobyte]], [[megabyte|megabyte]], [[gigabyte|gigabyte]], [[terabyte|terabyte]].</p><p>Now light up the lamps to make the numbers I ask for.</p>`,`<p>I byte si raggruppano in unità più grandi, come i gradi dei cacciatori: [[kilobyte|kilobyte]], [[megabyte|megabyte]], [[gigabyte|gigabyte]], [[terabyte|terabyte]].</p><p>Ora accendi le lampade per formare i numeri che ti chiedo.</p>`]},
   {type:'bits'},
   {who:'d', vis:'demon', text:[`<p>Flip! Flop! I'm the Bit Flipper. I turn your 1s into 0s and your numbers into nonsense!</p>`,`<p>Flip! Flop! Sono il Ribalta-Bit. Trasformo i tuoi 1 in 0 e i tuoi numeri in sciocchezze!</p>`]},

   {q:['Why do computers use binary?','Perché i computer usano il binario?'],a:[['Their circuits have two states: on and off','I loro circuiti hanno due stati: acceso e spento'],['Binary looks nicer','Il binario è più bello'],['Because of the keyboard','Per colpa della tastiera'],['It uses fewer colours','Usa meno colori']],why:['Two states are easy and reliable to build with transistors.','Due stati sono facili e affidabili da realizzare con i transistor.']},
  ]},
{ id:'a2m2', arc:1, sec:'2.3', pages:'29–30', hue:250, horns:3, eyes:2,
  title:['Secret Scrolls: Encoding Text','Pergamene segrete: codificare il testo'], topic:['ASCII and Unicode','ASCII e Unicode'],
  demon:['Garble Wraith','Spettro Pasticcione'], tech:['Binary Form · Second Technique: Cipher Seal','Stile Binario · Seconda Tecnica: Sigillo del Codice'],
  scenes:[
   {who:'s', vis:'asciitable', text:[`<p>A computer only understands numbers, so every character is stored as a number.</p><p>[[ASCII|ASCII]] (1963) uses <b>7 bits</b>, so it has 128 characters: English letters, digits, punctuation and control codes. A = 65, B = 66 … Z = 90, a = 97, space = 32.</p><p>Extended ASCII uses 8 bits, for 256 characters.</p>`,
     `<p>Un computer capisce solo numeri, quindi ogni carattere viene salvato come un numero.</p><p>Il codice [[ASCII|ASCII]] (1963) usa <b>7 bit</b>, quindi ha 128 caratteri: lettere inglesi, cifre, punteggiatura e codici di controllo. A = 65, B = 66 … Z = 90, a = 97, spazio = 32.</p><p>L'ASCII esteso usa 8 bit, per 256 caratteri.</p>`]},
   {who:'s', vis:'unicode', text:[`<p>But 128 characters aren't enough for the world. Where are è, ñ, Japanese kana or Arabic letters?</p><p>[[Unicode|Unicode]] gives a number to about 150,000 characters from almost every writing system, plus emoji. The common encoding [[UTF-8|UTF-8]] stores each character in 1 to 4 bytes, and the first 128 are the same as ASCII.</p>`,
     `<p>Ma 128 caratteri non bastano per tutto il mondo. Dove sono è, ñ, i caratteri giapponesi o arabi?</p><p>[[Unicode|Unicode]] assegna un numero a circa 150.000 caratteri di quasi tutti i sistemi di scrittura, più le emoji. La codifica più diffusa, [[UTF-8|UTF-8]], salva ogni carattere in un numero di byte da 1 a 4, e i primi 128 coincidono con l'ASCII.</p>`]},
   {who:'s', vis:'asciitable', text:[`<p>The Garble Wraith has left coded messages around the academy. Use the ASCII table to decode them.</p>`,`<p>Lo Spettro Pasticcione ha lasciato messaggi in codice in tutta l'accademia. Usa la tabella ASCII per decifrarli.</p>`]},
   {type:'ascii'},
   {who:'d', vis:'demon', text:[`<p>Gr8rbl… x#@!… I'm the Garble Wraith. I turn every letter into nonsense!</p>`,`<p>Gr8rbl… x#@!… Sono lo Spettro Pasticcione. Trasformo ogni lettera in un pasticcio!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['How many bits does standard ASCII use per character?','Quanti bit usa l\'ASCII standard per carattere?'],a:[['7 (128 characters)','7 (128 caratteri)'],['2','2'],['16','16'],['64','64']],why:['2⁷ = 128 characters.','2⁷ = 128 caratteri.']},
   {q:['In ASCII, code 65 is…','In ASCII, il codice 65 è…'],a:[['A','A'],['a','a'],['Z','Z'],['6','6']],why:['Capital letters start at A = 65.','Le maiuscole partono da A = 65.']},
   {q:['Why was Unicode created?','Perché è nato Unicode?'],a:[['ASCII couldn\'t represent the characters of all the world\'s languages','L\'ASCII non bastava per i caratteri di tutte le lingue del mondo'],['To make files bigger','Per rendere i file più grandi'],['To store colours','Per salvare i colori'],['To play sounds','Per riprodurre suoni']],why:['Unicode covers almost every writing system, plus emoji.','Unicode copre quasi tutti i sistemi di scrittura, più le emoji.']},
   {q:['Which character is NOT in standard 7-bit ASCII?','Quale carattere NON è nell\'ASCII standard a 7 bit?'],a:[['è','è'],['A','A'],['7','7'],['?','?']],why:['Accented letters like è need extended ASCII or Unicode.','Le lettere accentate come è richiedono l\'ASCII esteso o Unicode.']},
   {q:['How does a computer store the letter "B"?','Come salva un computer la lettera "B"?'],a:[['As the number 66, in binary','Come il numero 66, in binario'],['As a small picture','Come una piccola immagine'],['As a sound','Come un suono'],['It can\'t','Non può']],why:['B = 66 = 01000010 in binary.','B = 66 = 01000010 in binario.']},
   {q:['UTF-8 stores each character in…','UTF-8 salva ogni carattere in…'],a:[['1 to 4 bytes','Da 1 a 4 byte'],['Exactly 1 bit','Esattamente 1 bit'],['Always 8 bytes','Sempre 8 byte'],['A whole kilobyte','Un intero kilobyte']],why:['Common characters take 1 byte; others take up to 4.','I caratteri comuni occupano 1 byte, gli altri fino a 4.']},
  ]},
{ id:'a2m3', arc:1, sec:'2.4–2.6', pages:'31–39', hue:0, horns:4, eyes:3,
  title:['Pixels, Waves & Frames','Pixel, onde e fotogrammi'], topic:['Digital images, sound and video','Immagini, suoni e video digitali'],
  demon:['Pixel Ghoul','Ghoul dei Pixel'], tech:['Binary Form · Third Technique: Prism Burst','Stile Binario · Terza Tecnica: Esplosione Prismatica'],
  scenes:[
   {who:'s', vis:'pixels', text:[`<p>A digital image is a grid of tiny dots called [[pixels|pixel]]. In a black-and-white image, each pixel needs just 1 bit: 1 = coloured, 0 = empty.</p><p>[[Resolution|risoluzione]] is the number of pixels, like 1920 × 1080. More pixels = a sharper image, but a bigger file.</p>`,
     `<p>Un'immagine digitale è una griglia di puntini chiamati [[pixels|pixel]]. In un'immagine in bianco e nero ogni pixel richiede solo 1 bit: 1 = colorato, 0 = vuoto.</p><p>La [[Resolution|risoluzione]] è il numero di pixel, ad esempio 1920 × 1080. Più pixel = immagine più nitida, ma file più grande.</p>`]},
   {who:'s', vis:'rgbmix', text:[`<p>Colour pixels use [[RGB|RGB]]: a mix of <b>red</b>, <b>green</b> and <b>blue</b> light. Each channel goes from 0 to 255 (8 bits), so one pixel uses 24 bits, giving 256³ ≈ 16.7 million colours.</p><p>Images made of pixels are [[bitmap (raster)|bitmap (raster)]]. [[Vector graphics|grafica vettoriale]] stores shapes as maths (lines and curves) instead, so you can zoom without blur.</p>`,
     `<p>I pixel a colori usano il modello [[RGB|RGB]]: un mix di luce <b>rossa</b>, <b>verde</b> e <b>blu</b>. Ogni canale va da 0 a 255 (8 bit), quindi un pixel usa 24 bit: 256³ ≈ 16,7 milioni di colori.</p><p>Le immagini fatte di pixel sono [[bitmap (raster)|bitmap (raster)]]. La [[Vector graphics|grafica vettoriale]] invece salva le forme come formule (linee e curve): puoi ingrandire senza sgranare.</p>`]},
   {who:'s', vis:'sampling', text:[`<p>Sound is a wave. To digitise it, the computer measures the wave many times every second: this is [[sampling|campionamento]]. A music CD takes 44,100 samples per second (44.1 kHz) at 16 bits each.</p><p>[[Digital video|video digitale]] is a sequence of images called [[frames|fotogrammi]] shown quickly, for example 24, 30 or 60 frames per second (fps), plus the soundtrack.</p>`,
     `<p>Il suono è un'onda. Per digitalizzarlo, il computer misura l'onda moltissime volte al secondo: è il [[sampling|campionamento]]. Un CD musicale prende 44.100 campioni al secondo (44,1 kHz), da 16 bit ciascuno.</p><p>Il [[Digital video|video digitale]] è una sequenza di immagini chiamate [[frames|fotogrammi]] mostrate velocemente, ad esempio 24, 30 o 60 fotogrammi al secondo (fps), più la colonna sonora.</p>`]},
   {who:'s', vis:'rgbmix', text:[`<p>Now mix the light yourself. Move the sliders to match each target colour.</p>`,`<p>Ora mescola tu la luce. Muovi i cursori per ottenere ogni colore richiesto.</p>`]},
   {type:'rgb'},
   {who:'d', vis:'demon', text:[`<p>Krrrk… I am the Pixel Ghoul. I eat pixels and leave your photos blurry and grey!</p>`,`<p>Krrrk… Sono il Ghoul dei Pixel. Mangio i pixel e lascio le tue foto sgranate e grigie!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['What is a pixel?','Che cos\'è un pixel?'],a:[['The smallest dot of a digital image','Il puntino più piccolo di un\'immagine digitale'],['A type of camera','Un tipo di fotocamera'],['A sound sample','Un campione sonoro'],['A unit of speed','Un\'unità di velocità']],why:['Images are grids of pixels.','Le immagini sono griglie di pixel.']},
   {q:['"1920 × 1080" describes an image\'s…','"1920 × 1080" descrive di un\'immagine la…'],a:[['Resolution','Risoluzione'],['Colour depth','Profondità di colore'],['File name','Nome del file'],['Frame rate','Frequenza dei fotogrammi']],why:['Width × height in pixels = resolution.','Larghezza × altezza in pixel = risoluzione.']},
   {q:['What does RGB stand for?','Cosa significa RGB?'],a:[['Red, Green, Blue','Rosso, Verde, Blu (Red, Green, Blue)'],['Really Good Bits','Really Good Bits'],['Red, Grey, Black','Rosso, Grigio, Nero'],['Random Graphic Bytes','Random Graphic Bytes']],why:['Screens mix red, green and blue light.','Gli schermi mescolano luce rossa, verde e blu.']},
   {q:['Why does a vector image stay sharp when you zoom in?','Perché un\'immagine vettoriale resta nitida quando ingrandisci?'],a:[['It is stored as mathematical shapes, not pixels','È salvata come forme matematiche, non come pixel'],['It has more colours','Ha più colori'],['It is always black and white','È sempre in bianco e nero'],['It is compressed','È compressa']],why:['The computer redraws the shapes at any size.','Il computer ridisegna le forme a qualsiasi dimensione.']},
   {q:['Sampling a sound means…','Campionare un suono significa…'],a:[['Measuring the sound wave many times per second','Misurare l\'onda sonora molte volte al secondo'],['Playing it louder','Riprodurlo più forte'],['Deleting the silence','Cancellare i silenzi'],['Recording on tape','Registrarlo su nastro']],why:['Each measurement becomes a number stored in binary.','Ogni misura diventa un numero salvato in binario.']},
   {q:['A video at 60 fps shows…','Un video a 60 fps mostra…'],a:[['60 images per second','60 immagini al secondo'],['60 seconds of video','60 secondi di video'],['60 colours','60 colori'],['60 pixels','60 pixel']],why:['fps = frames per second.','fps = fotogrammi al secondo (frames per second).']},
  ]},
{ id:'a2m4', arc:1, sec:'2.7 + CLIL', pages:'40–47', hue:90, horns:2, eyes:1,
  title:['Compression & Hexadecimal','Compressione ed esadecimale'], topic:['Data compression, the digital divide, hexadecimal','Compressione dei dati, divario digitale, esadecimale'],
  demon:['Bloat Golem','Golem Gonfiato'], tech:['Binary Form · Fourth Technique: Compression Crush','Stile Binario · Quarta Tecnica: Schiacciata Compressa'],
  scenes:[
   {who:'s', vis:'rle', text:[`<p>[[Compression|compressione]] makes files smaller, so they take less space and travel faster.</p><p>[[Lossless|senza perdita]] compression loses nothing: the original is rebuilt exactly (ZIP, PNG, FLAC).</p><p>[[Lossy|con perdita]] compression throws away details we barely notice (JPEG, MP3, MP4). Files get much smaller, but the lost details never come back.</p>`,
     `<p>La [[Compression|compressione]] rende i file più piccoli: occupano meno spazio e viaggiano più veloci.</p><p>La compressione [[Lossless|senza perdita]] (lossless) non perde nulla: l'originale si ricostruisce identico (ZIP, PNG, FLAC).</p><p>La compressione [[Lossy|con perdita]] (lossy) elimina dettagli che quasi non notiamo (JPEG, MP3, MP4). I file diventano molto più piccoli, ma i dettagli persi non tornano più.</p>`]},
   {who:'s', vis:'hex', text:[`<p>Long strings of 0s and 1s are hard to read, so programmers use [[hexadecimal|esadecimale]]: base 16, with digits 0–9 and A–F (A = 10 … F = 15).</p><p>One hex digit = 4 bits, so one byte = 2 hex digits: 1111 1111 = <b>FF</b> = 255. Web colours are written in hex: #FF0000 is pure red. This is the CLIL page on p. 47.</p>`,
     `<p>Lunghe file di 0 e 1 sono difficili da leggere, quindi i programmatori usano l'[[hexadecimal|esadecimale]]: base 16, con le cifre 0–9 e A–F (A = 10 … F = 15).</p><p>Una cifra esadecimale = 4 bit, quindi un byte = 2 cifre: 1111 1111 = <b>FF</b> = 255. I colori del web si scrivono in esadecimale: #FF0000 è rosso puro. È la pagina CLIL a p. 47.</p>`]},
   {who:'s', vis:'divide', text:[`<p>One last lesson, about people rather than bits. The [[digital divide|divario digitale]] is the gap between people who have devices, a good connection and digital skills, and people who don't.</p><p>It exists between countries, between cities and the countryside, and between generations. Schools, governments and cheaper technology all help to close it.</p>`,
     `<p>Un'ultima lezione, sulle persone più che sui bit. Il [[digital divide|divario digitale]] è la distanza tra chi ha dispositivi, una buona connessione e competenze digitali, e chi non li ha.</p><p>Esiste tra Paesi, tra città e campagna e tra generazioni. Scuole, governi e tecnologia più economica aiutano a ridurlo.</p>`]},
   {type:'sort', title:['Lossless or lossy?','Senza perdita o con perdita?'], cats:[['Lossless','Senza perdita'],['Lossy','Con perdita']], items:[
     {n:['A ZIP folder of homework','Una cartella ZIP di compiti'],i:'zip',c:0,why:['ZIP must give back every file exactly.','Lo ZIP deve restituire ogni file identico.']},
     {n:['A PNG screenshot','Uno screenshot PNG'],i:'image',c:0,why:['PNG is lossless.','PNG è senza perdita.']},
     {n:['A JPEG holiday photo','Una foto delle vacanze in JPEG'],i:'image',c:1,why:['JPEG drops tiny details to save space.','JPEG elimina piccoli dettagli per risparmiare spazio.']},
     {n:['An MP3 song','Una canzone MP3'],i:'music',c:1,why:['MP3 removes sounds we hardly hear.','L\'MP3 elimina suoni che sentiamo appena.']},
     {n:['A FLAC music file','Un file musicale FLAC'],i:'music',c:0,why:['FLAC keeps every bit of the audio.','FLAC conserva ogni bit dell\'audio.']},
     {n:['An MP4 streaming video','Un video MP4 in streaming'],i:'video',c:1,why:['Video streaming uses lossy compression.','Lo streaming video usa compressione con perdita.']},
     {n:['A zipped program to install','Un programma compresso da installare'],i:'zip',c:0,why:['Changing even one bit could break a program.','Cambiare anche un solo bit potrebbe rompere un programma.']},
     {n:['A voice message in a chat app','Un messaggio vocale in chat'],i:'mic',c:1,why:['Voice messages are compressed with loss to stay small.','I vocali sono compressi con perdita per restare leggeri.']}]},
   {who:'d', vis:'demon', text:[`<p>BLOOOAAT! I am the Bloat Golem! I swell every file until your disk explodes!</p>`,`<p>GONFIOOO! Sono il Golem Gonfiato! Faccio gonfiare ogni file finché il disco esplode!</p>`]},
   {type:'battle'}],
  quiz:[
   {q:['Lossless compression means…','Compressione senza perdita significa…'],a:[['The original can be rebuilt exactly','L\'originale si ricostruisce identico'],['Some details are thrown away','Alcuni dettagli vengono eliminati'],['The file gets bigger','Il file diventa più grande'],['Only images can be compressed','Si possono comprimere solo immagini']],why:['Lossless = no information lost.','Senza perdita = nessuna informazione persa.']},
   {q:['Which format uses LOSSY compression?','Quale formato usa compressione CON PERDITA?'],a:[['JPEG','JPEG'],['ZIP','ZIP'],['PNG','PNG'],['FLAC','FLAC']],why:['JPEG removes small details from photos.','JPEG elimina piccoli dettagli dalle foto.']},
   {q:['Why must a program be compressed lossless?','Perché un programma va compresso senza perdita?'],a:[['Changing even one bit could break it','Cambiare anche un solo bit potrebbe romperlo'],['Programs are always small','I programmi sono sempre piccoli'],['Lossy is illegal','Con perdita è illegale'],['Programs are images','I programmi sono immagini']],why:['Instructions must stay exactly the same.','Le istruzioni devono restare identiche.']},
   {q:['What is hexadecimal FF in decimal?','Quanto vale FF esadecimale in decimale?'],a:[['255','255'],['16','16'],['100','100'],['1515','1515']],why:['F = 15: 15 × 16 + 15 = 255.','F = 15: 15 × 16 + 15 = 255.']},
   {q:['The web colour #FFFFFF is…','Il colore web #FFFFFF è…'],a:[['White','Bianco'],['Black','Nero'],['Red','Rosso'],['Blue','Blu']],why:['Red, green and blue all at maximum make white.','Rosso, verde e blu al massimo danno il bianco.']},
   {q:['What is the digital divide?','Che cos\'è il divario digitale?'],a:[['The gap between people with and without access to technology and digital skills','La distanza tra chi ha e chi non ha accesso alla tecnologia e competenze digitali'],['A broken screen','Uno schermo rotto'],['Dividing by 2 in binary','Dividere per 2 in binario'],['A type of compression','Un tipo di compressione']],why:['It is about access and skills, not maths.','Riguarda accesso e competenze, non la matematica.']},
   {q:['One hexadecimal digit represents how many bits?','Quanti bit rappresenta una cifra esadecimale?'],a:[['4','4'],['8','8'],['2','2'],['16','16']],why:['16 = 2⁴, so 4 bits.','16 = 2⁴, quindi 4 bit.']},
  ]},
