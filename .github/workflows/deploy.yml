name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - run: bun run build
      - name: Run helper regression tests
        run: bun tests/helpers.test.js
      - name: Run all unit tests
        run: bun run test:unit
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Generate Race Arena question bank seed
        run: bun run race:seed:generate
      - name: Upload Race Arena question bank seed
        uses: actions/upload-artifact@v4
        with:
          name: race-question-bank-seed
          path: supabase/seed/race_question_bank.sql
          if-no-files-found: error
          retention-days: 7
      - name: Load Race Arena question bank into Supabase
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Race Arena seed not loaded. Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets to enable automatic loading."
            exit 0
          fi
          bun run race:seed:load
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
